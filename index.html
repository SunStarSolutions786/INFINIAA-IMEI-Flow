  <title>INFINIAA IMEI Flow — Stock & Billing</title>
  <style>
    :root {

      --warning-soft: #3b2d17;
      --danger-soft: #3b2028;

      --shadow-md: 0 24px 55px rgba(0,0,0,.36);

    body[data-role="WAREHOUSE"] .global-search-wrap, body[data-field-role="true"] .global-search-wrap { display: none !important; }
    * { box-sizing: border-box; }

    html { height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    /* Restoring a Firebase session is async, so the sign-in form used to flash on every
       reload. The splash holds the screen until we actually know whether anyone is signed in. */
    .app-boot {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 12% 18%, rgba(183,122,0,.16), transparent 31%),
        radial-gradient(circle at 88% 82%, rgba(36,107,253,.14), transparent 34%),
        linear-gradient(145deg, var(--bg), color-mix(in srgb,var(--bg) 82%,#fff3cf));
      transition: opacity .32s ease;
    }
    .app-boot.is-leaving { opacity: 0; pointer-events: none; }
    .app-boot-inner { display: grid; justify-items: center; gap: 16px; }
    .app-boot-mark {
      width: 96px; height: 62px;

      border: 1px solid #e5cf91; border-radius: 18px;
      background: linear-gradient(145deg,#fff,#fff4cf);
      color: #9a6800; font-size: 12px; font-weight: 950; letter-spacing: .11em;
      box-shadow: 0 14px 35px rgba(148,99,0,.16);
      animation: bootPulse 1.6s ease-in-out infinite;
    }
    .app-boot-bar { width: 148px; height: 3px; border-radius: 999px; background: color-mix(in srgb,var(--text) 12%,transparent); overflow: hidden; }
    .app-boot-bar span { display: block; width: 40%; height: 100%; border-radius: 999px; background: linear-gradient(90deg,transparent,#b77a00,transparent); animation: bootSlide 1.1s ease-in-out infinite; }

    @keyframes riseIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .auth-gate:not([hidden]) .auth-shell { animation: riseIn .34s cubic-bezier(.2,.7,.2,1) both; }
    .app-shell:not([hidden]) .main { animation: riseIn .3s cubic-bezier(.2,.7,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {

    }

    .auth-brand { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:18px; }
    .auth-brand-mark { width:72px; height:48px; display:grid; place-items:center; border:1px solid #e5cf91; border-radius:15px; background:linear-gradient(145deg,#fff,#fff4cf); color:#9a6800; font-size:11px; font-weight:950; letter-spacing:.11em; box-shadow:0 14px 35px rgba(148,99,0,.14); }
    .auth-brand-copy h1 { margin:0; font-size:22px; letter-spacing:-.035em; }

    .auth-card { overflow:hidden; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow-md); }
    .auth-card-head { padding:24px 24px 14px; }

    .auth-submit { width:100%; justify-content:center; min-height:46px; margin-top:4px; }

    .auth-status.success { border-color:color-mix(in srgb,var(--success) 35%,var(--line)); background:var(--success-soft); color:var(--success); }
    button, input, select, textarea { font: inherit; }

    .top-date { margin-left: auto; color: var(--muted); white-space: nowrap; font-size: 12px; }
    .icon-button {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);

      transition: transform .15s, border .15s, color .15s;
    }
    .icon-button:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
    .icon-button svg { width: 18px; }
    .profile {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-left: 5px;
      white-space: nowrap;
    }
    .avatar { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; background: #172033; font-size: 12px; font-weight: 800; }
    .profile small { color: var(--muted); display: block; font-size: 10px; }

    }
    .page { max-width: 1600px; margin: 0 auto; animation: pageIn .18s ease; }
    @keyframes pageIn { from { opacity: .35; transform: translateY(3px); } to { opacity: 1; transform: none; } }

      align-items: flex-start;

    .card {

      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);

    }

    .grid { display: grid; gap: 16px; }

    .grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }

    .kpi-grid { display: grid; grid-template-columns: repeat(5,minmax(150px,1fr)); gap: 13px; margin-bottom: 16px; }
    .dashboard-metric-section {
      margin-bottom: 16px;

      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb,var(--surface) 92%,var(--surface-2));
      box-shadow: var(--shadow-sm);
    }
    .dashboard-metric-head {

      gap: 12px;
      margin-bottom: 12px;
    }
    .dashboard-metric-head h2 { margin: 0; font-size: 15px; letter-spacing: -.015em; }

    .dashboard-kpi-grid.five { grid-template-columns: repeat(5,minmax(0,1fr)); }
    .dashboard-kpi-grid.four { grid-template-columns: repeat(4,minmax(0,1fr)); }
    .dashboard-kpi-grid .kpi { height: 100%; box-shadow: none; }
    .dashboard-metric-section.today .kpi { --kpi-accent: #246bfd; }

    .dashboard-metric-section.month .kpi { --kpi-accent: #138a61; }
    .dashboard-metric-section .kpi {

      background: linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--kpi-accent) 5%,var(--surface)));
    }
    .dashboard-metric-section .kpi::after { background: color-mix(in srgb,var(--kpi-accent) 13%,var(--surface)); }
    .kpi {
      padding: 17px;
      padding-right: 32px;
      min-height: 112px;
      position: relative;
      overflow: hidden;
    }
    .kpi > * { position: relative; z-index: 1; }
    .kpi::after {
      content: "";
      position: absolute;
      width: 72px;
      height: 72px;
      right: -25px;
      top: -25px;

      transition: transform .24s ease, opacity .24s ease;
    }
    .dashboard-page .card, .pnl-page .kpi {

      background: linear-gradient(90deg,transparent,var(--kpi-accent,var(--accent)),transparent);

    @media (hover:hover) and (pointer:fine) {

        async importActivations(records, sourceFile) {

          return commit("importActivations", draft => {
            if (!Array.isArray(records) || !records.length) throw new Error("No activation records to import");

            const latestRows = new Map();
            const summary = { totalRows: records.length, uniqueIMEIs: 0, imported: 0, created: 0, updated: 0, unmatched: 0, duplicatesMerged: 0, invalid: 0 };
            records.forEach(record => {
              const imei = normalizeIMEI(record.imei);
              const activationDate = clean(record.activationDate);
              if (!isValidIMEI(imei) || !isValidDateISO(activationDate)) { summary.invalid++; return; }
              if (latestRows.has(imei)) summary.duplicatesMerged++;
              latestRows.set(imei, { imei, activationDate });
            });
            if (!latestRows.size) throw new Error("No valid activation rows to import");
            summary.uniqueIMEIs = latestRows.size;
            const importedAt = nowISO();
            const importedSource = clean(sourceFile) || "activation.csv";
            latestRows.forEach(record => {
              const { imei, activationDate } = record;
              const inventory = inventoryMap.get(imei);
              if (!inventory) {
                const unmatched = {
                  id: uid("UMA"), imei, activationDate, status: "ACTIVATED",
                  sourceFile: importedSource, reason: "IMEI not found in inventory", importedAt
                };
                draft.unmatchedActivations = draft.unmatchedActivations.filter(row => row.imei !== imei);
                draft.unmatchedActivations.unshift(unmatched);
                summary.unmatched++;
                return;
              }
              const wasActivated = inventory.activation?.status === "ACTIVATED";
              const activation = {
                id: uid("ACT"), imei, status: "ACTIVATED", activationDate,
                importedAt, sourceFile: importedSource
              };
              draft.activations = draft.activations.filter(row => row.imei !== imei);
              draft.activations.unshift(activation);
              inventory.activation = {
                status: "ACTIVATED", activationDate,
                importedAt: activation.importedAt, sourceFile: activation.sourceFile
              };
              draft.unmatchedActivations = draft.unmatchedActivations.filter(row => row.imei !== imei);
              inventory.updatedAt = nowISO();
              summary.imported++;
              summary[wasActivated ? "updated" : "created"]++;
            });
            audit(draft, "Activation Imported", "ACTIVATION", importedSource, null, summary);
            return summary;
          }, { inventory: touchedIMEIs });
        },

v>`:emptyState("Nothing captured yet","Choose an ordered model, then scan IMEIs or enter its received quantity.","scanner")}</section></div>`;

          ${draft.items.length?`<div class="table-wrap"><table><thead><tr><th>Tracking / Identifier</th><th>Product</th><th>Qty</th>${isWarehouseRole()?"":`<th>Cost / Unit</th><th>${order?"Order Unit Rate":canEditSaleRate?"Special Unit Rate":"Master Unit Price"}</th><th>Discount / Unit</th><th>Total</th>`}<th></th></tr></thead><tbody>
          ${totals.lines.map((row,index)=>`<tr id="sale-row-${index}"><td><span class="badge ${row.trackingMode===TRACKING_MODE.QUANTITY?"badge-info":""}">${row.trackingMode===TRACKING_MODE.QUANTITY?"Quantity Only":"Serial / IMEI"}</span><div class="mono cell-sub">${esc(row.imei||"Not required")}</div></td><td><div class="cell-main">${esc(row.brandName+" · "+row.modelName)}</div>${specialPriceSale?`<div class="cell-sub">Master: ${money(row.masterRate??row.rate)}</div>`:""}</td><td><strong>${row.qty}</strong></td>${isWarehouseRole()?"":`<td class="money">${money(row.purchaseRate)}</td><td>${canEditSaleRate?`<input class="input money" style="min-width:120px" type="number" min="1" step=".01" data-sale-line="rate" data-index="${index}" value="${attr(row.rate)}" aria-label="Special unit sale rate"><div class="cell-sub negative" id="sale-warning-${index}" style="display:${Number(row.rate)<Number(row.purchaseRate)?"block":"none"}">${Number(row.rate)<Number(row.purchaseRate)?"Selling below cost · Expected loss "+money((row.purchaseRate-row.rate)*row.qty):""}</div>`:`<span class="money">${money(row.rate)}</span>`}</td><td>${order?`<span class="cell-sub">Locked</span>`:`<input class="input money" style="min-width:100px" type="number" min="0" step=".01" max="${Math.max(0,Number(row.rate)-1)}" data-sale-line="discount" data-index="${index}" value="${attr(row.discount||0)}" aria-label="Discount per unit">`}</td><td class="money cell-main" id="sale-total-${index}">${money(row.total)}</td>`}<td><button class="btn btn-sm btn-ghost negative" data-action="remove-sale-item" data-index="${index}">Remove</button></td></tr>`).join("")}
          </tbody></table></div>

        </section>
      </div>`;
    };
    const getFilteredSales = db => {
      const f=state.salesFilters,needle=lower(state.salesHistorySearch);

        (!f.from||row.invoiceDate>=f.from)&&(!f.to||row.invoiceDate<=f.to)
        &&(!f.customerType||customerTypeOf(row)===f.customerType)
        &&(!f.customerId||row.customerId===f.customerId)
        &&(!f.brandId||row.items.some(item=>item.brandId===f.brandId))
        &&(!f.status||row.status===f.status)
        &&(!needle||[row.invoiceNumber,row.customerName,row.customerMobile,row.customerSnapshot?.address,row.customerSnapshot?.area,customerTypeLabel(row),saleModeLabel(row),...row.items.flatMap(item=>[item.imei,item.brandName,item.modelName])].some(item=>lower(item).includes(needle)))
      ).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
    };
    const renderSalesHistory = db => {
      const rows=getFilteredSales(db),f=state.salesFilters,customers=db.parties.filter(row=>["CUSTOMER","BOTH"].includes(row.type));

        <div class="field"><label>Registered Party</label><select class="select" data-sales-filter="customerId" ${f.customerType===CUSTOMER_TYPE.CASH?"disabled":""}>${options(customers,f.customerId,row=>row.name,"All registered parties")}</select></div>
        <div class="field"><label>Brand</label><select class="select" data-sales-filter="brandId">${options(db.brands,f.brandId,row=>row.name,"All brands")}</select></div>
        <div class="field"><label>Status</label><select class="select" data-sales-filter="status"><option value="">All</option><option value="COMPLETED" ${f.status==="COMPLETED"?"selected":""}>Completed</option><option value="CANCELLED" ${f.status==="CANCELLED"?"selected":""}>Cancelled</option></select></div>
        <button class="btn btn-sm" data-action="export-sales" style="align-self:flex-end">${icon("download")}CSV Export</button>
      </div><div id="sales-history-table">${salesHistoryTable(rows)}</div></section>`;
    };
    const salesHistoryTable=rows=>rows.length?`<div class="table-wrap"><table><thead><tr><th>Invoice / Tally Ref</th><th>Customer Type</th><th>Billing Source</th><th>Sale Type</th><th>Date</th><th>Customer / Buyer</th><th>Qty</th><th>Taxable</th><th>GST</th><th>Grand Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>
      ${capRows(rows).map(row=>{const cash=customerTypeOf(row)===CUSTOMER_TYPE.CASH;return `<tr><td class="cell-main">${esc(row.invoiceNumber)}</td><td><span class="badge ${cash?"badge-warning":""}">${cash?"Direct / Cash":"Registered Party"}</span></td><td><span class="badge ${saleUsesTally(row)?"badge-info":""}">${saleModeLabel(row)}</span></td><td><span class="badge ${row.saleType&&row.saleType!==SALE_TYPE.NORMAL?"badge-warning":""}">${esc(saleTypeLabel(row.saleType))}</span>${row.priceOverrideReason?`<div class="cell-sub">${esc(row.priceOverrideReason)}</div>`:""}</td><td>${dateFmt(row.invoiceDate)}</td><td><div class="cell-main">${esc(row.customerName)}</div><div class="cell-sub">${esc(row.customerMobile||"")}${cash&&row.customerSnapshot?.address?" · "+esc(row.customerSnapshot.address):""}</div></td><td>${row.totalQty||saleItemsQty(row.items)}</td><td class="money">${money(row.taxableValue)}</td><td class="money">${money(row.gstAmount)}</td><td class="money cell-main">${money(row.grandTotal)}</td><td>${statusBadge(row.status)}</td><td><div class="inline-actions"><button class="btn btn-sm" data-action="view-sale" data-id="${row.id}">View</button><button class="btn btn-sm" data-action="print-sale" data-id="${row.id}">${saleUsesTally(row)?"Print Copy":"Print"}</button>${row.status===ACTIVE_SALE?`<button class="btn btn-sm btn-danger-soft" data-action="cancel-sale" data-id="${row.id}">Void</button>`:""}</div></td></tr>`;}).join("")}</tbody></table></div>${capNote(rows,"invoices")}`:emptyState("No sales records","Create a registered-party or direct cash sale to see its history.","sales");

    // Returns
    const renderReturns = async db => {
      const tabBar=tabs([{id:"sales",label:"Sales Return"},{id:"purchase",label:"Purchase Return"},{id:"history",label:"Return History"}],state.returnsTab,"returns-tab");
      const content=state.returnsTab==="history"?renderReturnHistory(db):renderReturnEntry(db);
      return `<div class="page">${pageHeader("Returns","Use the same Serial / IMEI or quantity-only flow defined in Product Master.")}${tabBar}${content}</div>`;
    };
    const renderReturnEntry = db => {
      const isSales=state.returnsTab==="sales", lookup=state.returnLookup;
      const validLookup=lookup&&lookup.type===(isSales?"SALES_RETURN":"PURCHASE_RETURN");
      if(state.returnTracking===TRACKING_MODE.QUANTITY){
        const draft=state.returnQuantityDraft,type=isSales?"SALES_RETURN":"PURCHASE_RETURN";
        const sources=(isSales?db.sales.filter(row=>row.status===ACTIVE_SALE):db.purchases.filter(row=>row.status!=="CANCELLED")).filter(row=>row.items?.some(item=>item.trackingMode===TRACKING_MODE.QUANTITY));
        const source=sources.find(row=>row.id===draft.sourceId);
        const lines=(source?.items||[]).filter(item=>item.trackingMode===TRACKING_MODE.QUANTITY);
        const line=lines.find(item=>item.modelId===draft.modelId);
        const returned=line?sum(db.returns.filter(row=>row.type===type&&row.trackingMode===TRACKING_MODE.QUANTITY&&row.modelId===line.modelId&&(isSales?row.saleId===source.id:row.purchaseId===source.id)),row=>row.quantity):0;
        const eligible=line?Math.max(0,Number(line.qty)-returned):0;
        return `<section class="card"><div class="card-head"><div><h3>${isSales?"Quantity Sales Return":"Quantity Purchase Return"}</h3><div class="cell-sub">Select the original transaction, product and return quantity.</div></div><div class="segmented"><button data-action="return-tracking" data-tracking="SERIAL">Serial / IMEI</button><button class="active" data-action="return-tracking" data-tracking="QUANTITY">Quantity Only</button></div></div><div class="card-body">
          <form id="quantity-return-form"><input type="hidden" name="type" value="${type}"><div class="grid grid-3">
            <div class="field span-2"><label>Original ${isSales?"Sale":"Purchase"} <span class="required">*</span></label><select class="select" name="sourceId" data-quantity-return required>${options(sources,draft.sourceId,row=>row.invoiceNumber+" · "+(isSales?row.customerName:row.supplierName)+" · "+dateFmt(row.invoiceDate),"Choose original transaction")}</select></div>
            <div class="field"><label>Return Date <span class="required">*</span></label><input class="input" type="date" name="returnDate" data-quantity-return value="${attr(draft.returnDate||localDateISO())}" required></div>
            <div class="field span-2"><label>Product <span class="required">*</span></label><select class="select" name="modelId" data-quantity-return ${source?"":"disabled"} required>${options(lines,draft.modelId,row=>(row.brandName||"")+" · "+row.modelName+" · Purchased/Sold "+Number(row.qty),"Choose product")}</select></div>
            <div class="field"><label>Return Quantity <span class="required">*</span></label><input class="input" type="number" min="1" max="${eligible||1}" step="1" name="quantity" data-quantity-return value="${attr(draft.quantity)}" placeholder="Eligible ${eligible}" ${line?"":"disabled"} required><div class="help">${line?eligible+" unit(s) eligible":"Select product first"}</div></div>
            ${isSales?`<div class="field"><label>Return Outcome</label><select class="select" name="outcome" data-quantity-return><option value="IN_STOCK" ${draft.outcome!=="DAMAGED"?"selected":""}>Return to Stock</option><option value="DAMAGED" ${draft.outcome==="DAMAGED"?"selected":""}>Damaged</option></select></div>`:`<input type="hidden" name="outcome" value="RETURNED">`}
            <div class="field ${isSales?"":"span-2"}"><label>Reason <span class="required">*</span></label><input class="input" name="reason" data-quantity-return value="${attr(draft.reason)}" placeholder="Why is this being returned?" required></div>
            <div class="field span-3"><label>Remarks</label><textarea class="textarea" name="remarks" data-quantity-return placeholder="Optional details">${esc(draft.remarks)}</textarea></div>
          </div><div class="callout" style="margin-bottom:14px"><strong>No Serial / IMEI needed.</strong> Stock quantity and the original transaction link will be updated automatically.</div><div class="inline-actions" style="justify-content:flex-end"><button class="btn btn-primary" type="submit" ${eligible?"":"disabled"}>Confirm Quantity Return</button></div></form>
        </div></section>`;
      }
      return `<div class="grid grid-2">
        <section class="card">
          <div class="card-head"><h3>1. Search / scan Serial / IMEI</h3><div class="segmented"><button class="active" data-action="return-tracking" data-tracking="SERIAL">Serial / IMEI</button><button data-action="return-tracking" data-tracking="QUANTITY">Quantity Only</button></div></div>
          <div class="card-body">
            <div class="scanner-box scanner-console return-scan-console is-ready">
              <div class="scan-head"><div class="scan-identity"><div class="scan-icon">${icon("scanner")}</div><div class="scan-meta"><span class="scan-kicker">Return verification</span><h4>Check Serial / IMEI</h4><p class="scan-description">Enter one IMEI to fetch its original ${isSales?"sale":"purchase"} and product details.</p></div></div><div class="scanner-status"><span class="scanner-led"></span>Ready for input</div></div>
              <div class="scan-workbench">
                <form class="scan-input-shell" id="return-scan-form"><span class="scan-input-icon">${icon("scanner")}</span><input class="input scanner-input" id="return-scanner" name="imei" inputmode="text" autocomplete="off" placeholder="Scan Serial / IMEI"><span class="scan-input-actions"><span class="scan-enter-hint"><kbd>Enter ↵</kbd></span><button class="btn btn-sm btn-primary scan-add-button" type="submit">${icon("search")}Check IMEI</button></span></form>
                <div class="scan-counter"><span>Return</span><strong>${isSales?"S":"P"}</strong><small>${isSales?"Sales":"Purchase"}</small></div>
              </div>
              <div class="scan-footer"><div class="scan-feedback"><span class="scan-feedback-dot"></span><span>Enter or button performs the same lifecycle check</span></div><div class="scan-rule-chips"><span class="scan-chip">Original invoice</span><span class="scan-chip">Product auto-detect</span></div></div>
            </div>
            ${validLookup?`<div class="selected-party" style="margin-top:15px"><div><h3 class="mono">${esc(lookup.inventory.imei)}</h3><p>${esc(lookup.product)} · Current status: ${statusLabel(lookup.inventory.stockStatus)}</p></div><button class="btn btn-sm" data-action="clear-return-lookup">Change</button></div>`:""}
          </div>
        </section>
        <section class="card">
          <div class="card-head"><h3>2. Original transaction</h3></div>
          ${validLookup?`<div class="card-body"><div class="detail-grid">
            <div class="detail"><span>${isSales?(customerTypeOf(lookup.source)===CUSTOMER_TYPE.CASH?"Cash Buyer":"Registered Party"):"Supplier"}</span><strong>${esc(isSales?lookup.source.customerName:lookup.source.supplierName)}</strong>${isSales&&lookup.source.customerMobile?`<small>${esc(lookup.source.customerMobile)}</small>`:""}</div>
            <div class="detail"><span>${isSales&&saleUsesTally(lookup.source)?"Tally Invoice / Voucher Ref":"Original Invoice"}</span><strong>${esc(lookup.source.invoiceNumber)}</strong></div>
            <div class="detail"><span>Transaction Date</span><strong>${dateFmt(isSales?lookup.source.invoiceDate:lookup.source.invoiceDate)}</strong></div>
            ${isWarehouseRole()?`<div class="detail"><span>Verification</span><strong>Transaction matched</strong></div>`:`<div class="detail"><span>${isSales?"Sale Value":"Actual Purchase Cost"}</span><strong>${money(lookup.value)}</strong></div>`}
            ${isSales?`<div class="detail"><span>Customer Type</span><strong>${esc(customerTypeLabel(lookup.source))}</strong></div><div class="detail"><span>Billing Source</span><strong>${saleModeLabel(lookup.source)}</strong></div>${lookup.source.customerSnapshot?.address?`<div class="detail span-2"><span>Buyer Address</span><strong>${esc(lookup.source.customerSnapshot.address)}</strong></div>`:""}`:""}
          </div></div>`:emptyState("No IMEI selected","Scan an IMEI to show its original transaction.","search")}
        </section>
        ${validLookup?`<section class="card span-2"><div class="card-head"><h3>3. Confirm ${isSales?"sales":"purchase"} return</h3></div><div class="card-body">
          <form id="return-form"><input type="hidden" name="type" value="${isSales?"SALES_RETURN":"PURCHASE_RETURN"}"><input type="hidden" name="imei" value="${attr(lookup.inventory.imei)}">
            <div class="grid grid-3">
              <div class="field"><label>Return Date <span class="required">*</span></label><input class="input" type="date" name="returnDate" value="${localDateISO()}" required></div>
              ${isSales?`<div class="field"><label>Return Outcome <span class="required">*</span></label><select class="select" name="outcome"><option value="IN_STOCK">Return to Stock</option><option value="DAMAGED">Damaged</option></select></div>`:isWarehouseRole()?`<div class="field"><label>Return Processing</label><input class="input" value="Price controlled by Back Office" readonly></div>`:`<div class="field"><label>Return Value</label><input class="input" value="${money(lookup.value)}" readonly></div>`}
              <div class="field"><label>Reason <span class="required">*</span></label><input class="input" name="reason" required placeholder="Why is this being returned?"></div>
            </div>
            <div class="field"><label>Remarks</label><textarea class="textarea" name="remarks" placeholder="Optional details"></textarea></div>
            <div class="inline-actions" style="justify-content:flex-end"><button class="btn btn-primary" type="submit">Confirm Return</button></div>
          </form>
        </div></section>`:""}
      </div>`;

    const renderReturnHistory=db=>`<section class="card"><div class="toolbar"><strong>${db.returns.length} return records</strong><div class="toolbar-spacer"></div>${isWarehouseRole()?"":`<button class="btn btn-sm" data-action="export-returns">${icon("download")}CSV Export</button>`}</div>
      ${db.returns.length?`<div class="table-wrap"><table><thead><tr><th>Return ID</th><th>Date</th><th>Type</th><th>Product / Identifier</th><th>Tracking</th><th>Qty</th><th>Party / Buyer</th><th>Original Invoice</th>${isWarehouseRole()?"":"<th>Value</th>"}<th>Outcome</th><th>Reason</th></tr></thead><tbody>
      ${capRows([...db.returns].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))).map(row=>{const cash=row.type==="SALES_RETURN"&&row.customerType===CUSTOMER_TYPE.CASH;return `<tr><td class="cell-main">${esc(row.id)}</td><td>${dateFmt(row.returnDate)}</td><td>${row.type==="SALES_RETURN"?'<span class="badge badge-info">Sales Return</span>':'<span class="badge badge-warning">Purchase Return</span>'}</td><td ${row.imei&&!isWarehouseRole()?`data-action="imei-360" data-imei="${attr(row.imei)}" style="cursor:pointer"`:""}><div class="cell-main">${esc(row.productName||row.imei||"—")}</div>${row.imei?`<div class="mono cell-sub">${esc(row.imei)}</div>`:""}</td><td><span class="badge ${row.trackingMode===TRACKING_MODE.QUANTITY?"badge-info":""}">${row.trackingMode===TRACKING_MODE.QUANTITY?"Quantity Only":"Serial / IMEI"}</span></td><td><strong>${Number(row.quantity||1)}</strong></td><td><div class="cell-main">${esc(row.partyName)}</div><div class="cell-sub">${cash?"Direct / Cash · ":""}${esc(row.customerMobile||"")}</div></td><td>${esc(row.originalInvoice)}</td>${isWarehouseRole()?"":`<td class="money">${money(row.value)}</td>`}<td>${statusBadge(row.outcome)}</td><td>${esc(row.reason)}</td></tr>`;}).join("")}</tbody></table></div>${capNote(db.returns,"returns")}`:emptyState("No returns","Completed returns will appear here.","returns")}
    </section>`;

    // Expenses
    const renderExpenses = async db => {
      const range=presetRange(state.expenseRange==="custom"?"month":state.expenseRange);
      if(state.expenseRange==="custom"){range.from=state.expenseFrom||localDateISO();range.to=state.expenseTo||localDateISO();}
      const rows=db.expenses.filter(row=>inRange(row.date,range.from,range.to)).sort((a,b)=>b.date.localeCompare(a.date));
      const heads=db.expenseHeads.filter(row=>row.status==="ACTIVE");
      return `<div class="page">${pageHeader("Expenses","Record operational expenses without accounting complexity.",datePresetControl(state.expenseRange,"expense-preset"))}
        <div class="grid grid-3">
          <section class="card"><div class="card-head"><h3>Add expense</h3></div><div class="card-body"><form id="expense-form">
            <div class="field"><label>Date <span class="required">*</span></label><input class="input" type="date" name="date" value="${localDateISO()}" required></div>
            <div class="field"><label>Expense Head <span class="required">*</span></label><select class="select" name="expenseHeadId" required>${options(heads,"",row=>row.name,"Choose head")}</select></div>
            <div class="field"><label>Amount <span class="required">*</span></label><input class="input" type="number" step=".01" min=".01" name="amount" placeholder="0.00" required></div>
            <div class="field"><label>Reference</label><input class="input" name="reference" placeholder="Optional reference"></div>
            <div class="field"><label>Remarks</label><textarea class="textarea" name="remarks" placeholder="Optional details"></textarea></div>
