      else if(target.id==="ledger-from"){state.ledgerFrom=target.value;await renderRoute();}
      else if(target.id==="ledger-to"){state.ledgerTo=target.value;await renderRoute();}
      else if(target.id==="pnl-from"){state.pnlFrom=target.value;await renderRoute();}
      else if(target.id==="pnl-to"){state.pnlTo=target.value;await renderRoute();}
      else if(target.id==="user-role-filter"){state.userRoleFilter=target.value;await renderRoute();}
      else if(target.id==="field-order-status"){state.fieldOrderStatus=target.value;await renderRoute();}
      else if(target.id==="field-order-salesman"){state.fieldOrderSalesmanId=target.value;await renderRoute();}
      else if(target.id==="plan-date"){state.planDate=target.value;state.planDraft.date=target.value;await renderRoute();}
      else if(target.id==="plan-salesman"){state.planSalesmanId=target.value;await renderRoute();}
    });
    document.addEventListener("focusin",e=>{
      if(e.target.id==="order-party-search")showOrderPartySuggestions(e.target.value);
      else if(e.target.id==="purchase-order-supplier-search")showPurchaseOrderSupplierSuggestions(e.target.value);
      else if(e.target.id==="purchase-import-supplier-search")showPurchaseImportSupplierSuggestions(e.target.value);
      else if(e.target.id==="sale-customer-search")showPartySuggestions(e.target.value);
      else if(e.target.id==="cash-buyer-search")showCashBuyerSuggestions(e.target.value);
      else if(e.target.id==="money-party-search")showMoneyPartySuggestions(e.target.value);
    });
    document.addEventListener("input",e=>{
      const target=e.target;
      if(target.matches("[data-sale-line]")){
        const row=state.saleDraft.items[Number(target.dataset.index)];if(row){row[target.dataset.saleLine]=Number(target.value||0);refreshSaleCalculations();}
      }
      else if(target.matches('[data-draft="purchase"]')&&target.name!=="modelId")state.purchaseDraft[target.name]=target.value;
      else if(target.matches('[data-purchase-order-draft]')){state.purchaseOrderDraft[target.name]=target.value;const add=$("#purchase-order-item-add");if(add)add.disabled=!(state.purchaseOrderDraft.modelId&&Number(state.purchaseOrderDraft.quantity)>0&&Number(state.purchaseOrderDraft.rate)>0);}
      else if(target.matches('[data-purchase-receive]')){state.purchaseReceiveDraft[target.name]=target.value;const save=$("[data-action='save-purchase-order-receipt']");if(save)save.disabled=!(save.dataset.receiptComplete==="1"&&clean(state.purchaseReceiveDraft.invoiceNumber)&&isValidDateISO(state.purchaseReceiveDraft.invoiceDate));}
      else if(target.matches('[data-purchase-import-setup]')){state.purchaseImportSetup[target.name]=target.value;state.purchaseImport=null;const choose=$("[data-action='choose-purchase-csv']");if(choose)choose.disabled=!(state.purchaseImportSetup.supplierId&&clean(state.purchaseImportSetup.invoiceNumber)&&isValidDateISO(state.purchaseImportSetup.invoiceDate));}
      else if(target.matches('[data-order-draft]')){state.saleOrderDraft[target.name]=target.value;const add=$("#sale-order-item-add");if(add)add.disabled=!(state.saleOrderDraft.modelId&&Number(state.saleOrderDraft.quantity)>0&&Number(state.saleOrderDraft.rate)>0);}
      else if(target.matches('[data-field-order-draft]')){state.fieldOrderDraft[target.name]=target.value;const add=$("#field-order-item-form button[type='submit']");if(add)add.disabled=!(state.fieldOrderDraft.partyId&&state.fieldOrderDraft.modelId&&Number(state.fieldOrderDraft.quantity)>0);}
      else if(target.matches('[data-plan-draft]'))state.planDraft[target.name]=target.value;
      else if(target.matches('[data-draft="sale"]'))state.saleDraft[target.name]=target.value;
      else if(target.matches('[data-cash-buyer]')){
        state.saleDraft.cashBuyer[target.name]=target.name==="gstin"?target.value.toUpperCase():target.value;
        const fieldName=target.name;clearTimeout(target._timer);target._timer=setTimeout(async()=>{await renderRoute();const input=$(`[data-cash-buyer][name="${fieldName}"]`);if(input){input.focus();input.setSelectionRange?.(input.value.length,input.value.length);}},180);
      }
      else if(target.matches('[data-quantity-sale]')){state.quantitySaleDraft[target.name]=target.value;const add=$("#sale-quantity-form button[type='submit']");if(add)add.disabled=!(state.quantitySaleDraft.modelId&&Number(state.quantitySaleDraft.quantity)>0);}
      else if(target.matches('[data-quantity-return]'))state.returnQuantityDraft[target.name]=target.value;
      else if(target.id==="sale-customer-search")showPartySuggestions(target.value);
      else if(target.id==="cash-buyer-search"){state.saleDraft.cashBuyerSearch=target.value;showCashBuyerSuggestions(target.value);}
      else if(target.id==="order-party-search")showOrderPartySuggestions(target.value);
      else if(target.id==="purchase-order-supplier-search")showPurchaseOrderSupplierSuggestions(target.value);
      else if(target.id==="purchase-import-supplier-search"){state.purchaseImportSupplierSearch=target.value;showPurchaseImportSupplierSuggestions(target.value);}
      else if(target.id==="money-party-search"){state.moneyPartySearch=target.value;showMoneyPartySuggestions(target.value);}
      else if(target.id==="ledger-party-search"){
        state.ledgerPartySearch=target.value;
        clearTimeout(target._timer);target._timer=setTimeout(async()=>{await renderRoute();const input=$("#ledger-party-search");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},180);
      }
      else if(target.id==="master-search"){
        state.masterSearch=target.value;
        clearTimeout(target._timer);target._timer=setTimeout(async()=>{await renderRoute();const input=$("#master-search");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},180);
      }
      else if(target.id==="stock-search"){
        state.stockSearch=target.value;
        clearTimeout(target._timer);target._timer=setTimeout(async()=>{await renderRoute();const input=$("#stock-search");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},180);
      }
      else if(target.id==="inventory-search"){
        state.inventorySearch=target.value;state.inventoryPage=1;
        clearTimeout(target._timer);target._timer=setTimeout(async()=>{await renderRoute();const input=$("#inventory-search");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},220);
      }
      else if(target.id==="report-search"){
        state.reportSearch=target.value;
        clearTimeout(target._timer);target._timer=setTimeout(async()=>{await renderRoute();const input=$("#report-search");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},220);
      }
      else if(target.id==="money-search"){
        state.moneySearch=target.value;
        clearTimeout(target._timer);target._timer=setTimeout(async()=>{await renderRoute();const input=$("#money-search");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},220);
      }
      else if(target.id==="outstanding-search"){
        state.outstandingSearch=target.value;
        clearTimeout(target._timer);target._timer=setTimeout(async()=>{await renderRoute();const input=$("#outstanding-search");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},220);
      }
      else if(target.id==="ledger-search"){
        state.ledgerSearch=target.value;
        clearTimeout(target._timer);target._timer=setTimeout(async()=>{await renderRoute();const input=$("#ledger-search");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},220);
      }
      else if(target.matches('[data-activation-party-search]')){
        state.activationFilters.party=target.value;
        state.activationPage=1;
        clearTimeout(target._timer);target._timer=setTimeout(async()=>{await renderRoute();const input=$('[data-activation-party-search]');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},220);
      }
      else if(["user-search","field-order-search","plan-search"].includes(target.id)){
        const stateKey=target.id==="user-search"?"userSearch":target.id==="field-order-search"?"fieldOrderSearch":"planSearch";state[stateKey]=target.value;
        clearTimeout(target._timer);target._timer=setTimeout(async()=>{await renderRoute();const input=$("#"+target.id);if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},200);
      }
      else if(target.id==="sales-history-search")filterSalesHistory(target.value);
    });

    const filterSalesHistory=async value=>{
      state.salesHistorySearch=value;
      const db=await dataService.getDatabase(),rows=getFilteredSales(db);
      const root=$("#sales-history-table");if(root)root.innerHTML=salesHistoryTable(rows);
    };

    // Scanner and global-search keyboard behavior
    document.addEventListener("keydown",async e=>{
      const target=e.target;
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#global-search").focus();$("#global-search").select();return;}
      if(e.key==="Escape"){closeModal();closeDrawer();closeSuggestionLists();document.body.classList.remove("sidebar-open");return;}
      if(e.key!=="Enter")return;
      if(target.id==="global-search"){
        e.preventDefault();const value=clean(target.value),first=$("#global-suggestions [data-action='global-result']");
        if(isValidIMEI(normalizeIMEI(value)))await openIMEI360(normalizeIMEI(value));else if(first)first.click();
      }
      else if(target.id==="order-party-search"){
        const first=$("#order-party-suggestions [data-action='select-order-party']");if(first){e.preventDefault();first.click();}
      }
      else if(target.id==="purchase-order-supplier-search"){
        const first=$("#purchase-order-supplier-suggestions [data-action='select-purchase-order-supplier']");if(first){e.preventDefault();first.click();}
      }
      else if(target.id==="purchase-import-supplier-search"){
        const first=$("#purchase-import-supplier-suggestions [data-action='select-purchase-import-supplier']");if(first){e.preventDefault();first.click();}
      }
      else if(target.id==="cash-buyer-search"){
        const first=$("#cash-buyer-suggestions [data-action='select-cash-buyer']");if(first){e.preventDefault();first.click();}
      }
      else if(target.id==="money-party-search"){
        const first=$("#money-party-suggestions [data-action='select-money-party']");if(first){e.preventDefault();first.click();}
      }
      else if(target.id==="ledger-party-search"){
        const first=$("#ledger-directory-table [data-action='select-ledger-party']");if(first){e.preventDefault();first.click();}
      }
    });
    const lookupReturnIMEI=async imei=>{
      if(!isValidIMEI(imei)){toast("Enter a valid Serial / IMEI","error","Use 6–40 supported characters");return;}
      const db=await dataService.getDatabase(["sales","purchases"]),inv=await dataService.lookupIMEI(imei);
      if(!inv){toast("IMEI not found","error");return;}
      const maps=getMaps(db),isSales=state.returnsTab==="sales";
      let source,value;
      if(isSales){
        if(inv.stockStatus!==STATUS.SOLD||!inv.saleId){toast("IMEI is not currently sold","error","Current status: "+statusLabel(inv.stockStatus));return;}
        source=db.sales.find(row=>row.id===inv.saleId&&row.status===ACTIVE_SALE);
        const line=source?.items.find(row=>row.imei===imei);value=line?.taxableValue;
      }else{
        if(![STATUS.IN_STOCK,STATUS.DAMAGED].includes(inv.stockStatus)){toast("Purchase return not allowed","error","IMEI must be in stock or damaged first");return;}
        source=db.purchases.find(row=>row.id===inv.purchaseId);value=inv.purchaseRate;
      }
      if(!source){toast("Original transaction not found","error");return;}
      state.returnLookup={type:isSales?"SALES_RETURN":"PURCHASE_RETURN",inventory:inv,source,value,product:productName(inv,maps).text};
      await renderRoute();
    };

    const globalSearchInput=$("#global-search");
    globalSearchInput.addEventListener("input",debounce(async()=>{
      const results=await dataService.globalSearch(globalSearchInput.value),root=$("#global-suggestions");
      root.innerHTML=results.length?`<div class="suggestions">${results.map(row=>`<button class="suggestion" data-action="global-result" data-type="${row.type}" data-id="${attr(row.id)}" data-title="${attr(row.title)}"><strong><span class="badge badge-info" style="margin-right:7px">${row.type}</span> ${esc(row.title)}</strong><small>${esc(row.subtitle)}</small></button>`).join("")}</div>`:clean(globalSearchInput.value)?`<div class="suggestions"><div style="padding:12px;color:var(--muted)">No matching IMEI, invoice, voucher, party or cash buyer</div></div>`:"";
    },120));

    // File inputs
    $("#purchase-csv-file").addEventListener("change",async e=>{
      const file=e.target.files[0];if(!file)return;
      try{state.purchaseImport=await preparePurchaseCSV(file);state.purchaseTab="import";await renderRoute();toast("Purchase CSV reviewed","success",state.purchaseImport.stats.valid+" valid rows");}
      catch(error){console.error(error);toast(error.message||"Unable to read CSV","error");}
    });
    $("#activation-csv-file").addEventListener("change",async e=>{
      const file=e.target.files[0];if(!file)return;
      try{state.activationImport=await prepareActivationCSV(file);state.activationTab="import";await renderRoute();toast("Activation CSV reviewed","success",state.activationImport.stats.uniqueIMEIs+" unique IMEIs ready");}
      catch(error){console.error(error);toast(error.message||"Unable to read CSV","error");}
    });
    $("#master-csv-file").addEventListener("change",async e=>{
      const file=e.target.files[0],type=state.masterImportType;if(!file||!type)return;
      try{await importMasterCSV(file,type);}
      catch(error){console.error(error);toast(error.message||"Unable to import master CSV","error");}
    });
    $("#backup-file").addEventListener("change",async e=>{
      const file=e.target.files[0];if(!file)return;
      try{
        const candidate=JSON.parse(await readFileText(file));
        const ok=await confirmAction({title:"Restore backup?",message:"Current business data will be replaced after validation. User accounts and profiles will be preserved.",confirmLabel:"Restore Backup",danger:true});
        if(!ok)return;
        await dataService.importBackup(candidate);resetDraftState();closeModal();toast("Backup restored");await renderRoute();
      }catch(error){console.error(error);toast(error.message||"Invalid backup file","error");}
    });

    // Shell controls
    $("#menu-toggle").addEventListener("click",()=>document.body.classList.toggle("sidebar-open"));
    $("#mobile-overlay").addEventListener("click",()=>document.body.classList.remove("sidebar-open"));
    $("#theme-toggle").addEventListener("click",()=>{
      const dark=document.documentElement.dataset.theme!=="dark";
      window.localStorage.setItem(THEME_KEY,dark?"dark":"light");
      applyTheme(dark);
    });
    const applyTheme=dark=>{
      document.documentElement.dataset.theme=dark?"dark":"light";
      $("#theme-toggle").innerHTML=icon(dark?"sun":"moon");
      $("#theme-toggle").setAttribute("aria-pressed",String(dark));
    };
    const applyRole=()=>{
      document.body.dataset.role=currentRole;
      document.body.dataset.fieldRole=String(isFieldRole());
      const initials=roleLabel(currentRole).split(" ").map(word=>word[0]).join("").slice(0,2);
      $("#profile-avatar").textContent=initials;
      $("#profile-name").textContent=currentUser?.name||roleLabel(currentRole);
      $("#profile-role").textContent=roleLabel(currentRole);
      const routes=new Set(allowedRoutes());$$('[data-route]').forEach(link=>{link.hidden=!routes.has(link.dataset.route);});
    };
    window.addEventListener("hashchange",()=>{if(!$("#app-shell").hidden)renderRoute();});

    // Firebase Authentication and app initialization
    let startupPromise=null,startupUid="",pendingAuthMessage=null,profileUnsubscribe=null;
    const friendlyFirebaseError=error=>({
      "auth/invalid-credential":"Email or password is incorrect.",
      "auth/user-not-found":"Email or password is incorrect.",
      "auth/wrong-password":"Email or password is incorrect.",
      "auth/email-already-in-use":"This email is already in use.",
      "auth/weak-password":"Use a stronger password with at least 8 characters.",
      "auth/too-many-requests":"Too many attempts. Please wait and try again.",
      "auth/network-request-failed":"Network connection failed. Check your internet connection.",
      "permission-denied":"You do not have permission to complete this action.",
      "failed-precondition":"This service is not ready. Contact the Administrator."
    })[error?.code]||error?.message||"Something went wrong. Please try again.";
    const friendlySignInError=error=>({
      "auth/invalid-credential":"Email or password is incorrect.",
      "auth/user-not-found":"Email or password is incorrect.",
      "auth/wrong-password":"Email or password is incorrect.",
      "auth/too-many-requests":"Too many attempts. Please wait and try again.",
      "auth/network-request-failed":"Please check your internet connection and try again.",
      "permission-denied":"You do not have access. Contact the Administrator.",
      "failed-precondition":"Your account cannot be opened right now. Contact the Administrator."
    })[error?.code]||([
      "Your account is not ready. Contact the Administrator.",
      "The application needs an update. Contact the Administrator.",
      "Your account is inactive. Contact the Administrator.",
      "Your account is not set up. Contact the Administrator.",
      "Your account could not be loaded. Contact the Administrator."
    ].includes(error?.message)?error.message:"Unable to sign in right now. Please try again.");
    const setAuthMessage=(message="",type="")=>{
      const node=$("#auth-status");node.textContent=message;node.className="auth-status"+(message?" show":"")+(type?" "+type:"");
    };
    const setFormBusy=(form,busy)=>{
      $$('input,button,select,textarea',form).forEach(control=>{control.disabled=busy;});
    };
    const setBootNote=text=>{const note=$("#app-boot-note");if(note)note.textContent=text;};
    // If the network stalls, say so rather than spinning silently forever.
    const bootStallTimer=setTimeout(()=>setBootNote("Still connecting — check your internet connection."),15000);
    // Fades the splash out once, then leaves it out for the rest of the session.
    const dismissBootSplash=()=>{
      clearTimeout(bootStallTimer);
      const splash=$("#app-boot");
      if(!splash||splash.hidden||splash.classList.contains("is-leaving"))return;
      splash.classList.add("is-leaving");
      setTimeout(()=>{splash.hidden=true;},320);
    };
    const showSignedOut=(message="",type="")=>{
      dataService.stopRealtime();
      profileUnsubscribe?.();profileUnsubscribe=null;
      currentUser=null;currentUserId="";currentRole="";startupUid="";
      document.body.dataset.role="";document.body.dataset.fieldRole="false";
      $("#app-shell").hidden=true;$("#auth-gate").hidden=false;
      dismissBootSplash();
      setAuthMessage(message,type);
    };
    const loadFirebaseProfile=async uidValue=>{
      const snapshot=await getDoc(doc(companyCollection("users"),uidValue));
      if(!snapshot.exists())throw new Error("Your account is not set up. Contact the Administrator.");
      const profile=snapshot.data();
      if(profile.status!=="ACTIVE")throw new Error("Your account is inactive. Contact the Administrator.");
      if(!Object.values(ROLES).includes(profile.role))throw new Error("This user profile has an invalid role.");
      return profile;
    };
    const handleLiveCloudRefresh=async()=>{
      const db=await dataService.getDatabase(),profile=db.users.find(user=>user.id===firebaseAuth.currentUser?.uid);
      if(!profile||profile.status!=="ACTIVE"){
        pendingAuthMessage={message:"Your account is no longer active. Contact the Administrator.",type:"error"};
        await signOut(firebaseAuth);return;
      }
      currentUser=profile;currentUserId=profile.id;currentRole=profile.role;applyRole();
      const route=location.hash.replace(/^#\/?/,"").split("/")[0];
      if(!allowedRoutes().includes(route))location.hash="#/"+roleDefaultRoute();else await renderRoute();
    };
    const startAuthenticatedApp=user=>{
      if(startupPromise&&startupUid===user.uid)return startupPromise;
      startupUid=user.uid;
      startupPromise=(async()=>{
        const profile=await loadFirebaseProfile(user.uid);
        currentUser=profile;currentUserId=profile.id;currentRole=profile.role;
        await dataService.initialize();
        const db=await dataService.getDatabase(),cloudProfile=db.users.find(item=>item.id===user.uid&&item.status==="ACTIVE");
        if(!cloudProfile)throw new Error("Your account could not be loaded. Contact the Administrator.");
        currentUser=cloudProfile;currentRole=cloudProfile.role;
        $("#auth-gate").hidden=true;$("#app-shell").hidden=false;dismissBootSplash();setAuthMessage();
        const savedTheme=window.localStorage.getItem(THEME_KEY);
        applyTheme(savedTheme?savedTheme==="dark":Boolean(db.settings.darkMode));
        applyRole();
        $("#top-date").textContent=new Intl.DateTimeFormat("en-IN",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}).format(new Date());
        hydrateIcons();
        dataService.startRealtime(handleLiveCloudRefresh);
        profileUnsubscribe?.();
        profileUnsubscribe=onSnapshot(doc(companyCollection("users"),user.uid),async snapshot=>{
          const latest=snapshot.exists()?snapshot.data():null;
          if(!latest||latest.status!=="ACTIVE"){
            pendingAuthMessage={message:"Your account is inactive or no longer available. Contact the Administrator.",type:"error"};
            await signOut(firebaseAuth);return;
          }
          if(currentUser&&(latest.role!==currentRole||latest.name!==currentUser.name)){
            currentUser=latest;currentUserId=latest.id;currentRole=latest.role;applyRole();
          }
        },error=>console.error("User profile listener failed",error));
        const route=location.hash.replace(/^#\/?/,"").split("/")[0];
        if(!route||!allowedRoutes().includes(route))location.hash="#/"+roleDefaultRoute();else await renderRoute();
      })().finally(()=>{startupPromise=null;});
      return startupPromise;
    };
    $("#login-form").addEventListener("submit",async event=>{
      event.preventDefault();const form=event.currentTarget,values=formObject(form);
      setFormBusy(form,true);setAuthMessage("Signing in…");
      try{await authPersistenceReady;await signInWithEmailAndPassword(firebaseAuth,lower(values.email),values.password);}
      catch(error){setAuthMessage(friendlySignInError(error),"error");}
      finally{setFormBusy(form,false);}
    });
    hydrateIcons();
    applyTheme(window.localStorage.getItem(THEME_KEY)==="dark");
    authPersistenceReady.then(()=>onAuthStateChanged(firebaseAuth,async user=>{
      if(!user){const notice=pendingAuthMessage;pendingAuthMessage=null;showSignedOut(notice?.message||"",notice?.type||"");return;}
      setBootNote("Opening your account…");
      setAuthMessage("Opening your account…");
      try{await startAuthenticatedApp(user);}
      catch(error){console.error(error);pendingAuthMessage={message:friendlySignInError(error),type:"error"};await signOut(firebaseAuth);}
    })).catch(error=>showSignedOut(friendlySignInError(error),"error"));
  })();
  </script>
</body>
</html>
