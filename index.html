          </form></div></section>
          <section class="card span-2"><div class="card-head"><div><h3>Expense history</h3><div class="cell-sub">${dateFmt(range.from)} – ${dateFmt(range.to)}</div></div><strong class="negative">${money(sum(rows,row=>row.amount))}</strong></div>
            ${state.expenseRange==="custom"?`<div class="toolbar"><div class="field"><label>From</label><input class="input" type="date" id="expense-from" value="${attr(range.from)}"></div><div class="field"><label>To</label><input class="input" type="date" id="expense-to" value="${attr(range.to)}"></div></div>`:""}
            ${rows.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Expense Head</th><th>Amount</th><th>Reference</th><th>Remarks</th><th></th></tr></thead><tbody>
            ${capRows(rows).map(row=>`<tr><td>${dateFmt(row.date)}</td><td class="cell-main">${esc(row.expenseHead)}</td><td class="money negative">${money(row.amount)}</td><td>${esc(row.reference||"—")}</td><td>${esc(row.remarks||"—")}</td><td><button class="btn btn-sm" data-action="edit-expense" data-id="${row.id}">Edit</button></td></tr>`).join("")}</tbody></table></div>${capNote(rows,"expenses")}`:emptyState("No expenses in this period","Add an expense using the simple form.","expenses")}
          </section>
        </div>
      </div>`;
    };

    // Credit / Debit Notes
    const renderCnDn = async db => {
      let range=presetRange(state.cndnPreset==="custom"?"month":state.cndnPreset);
      if(state.cndnPreset==="custom"){range.from=state.cndnFrom||localDateISO();range.to=state.cndnTo||localDateISO();}
      const rows=db.notes.filter(row=>inRange(row.date,range.from,range.to)).sort((a,b)=>String(b.date+b.createdAt).localeCompare(String(a.date+a.createdAt)));
      const adjustment=sum(rows,row=>row.effect==="INCREASE"?Number(row.amount):-Number(row.amount));
      const parties=db.parties.filter(row=>row.status==="ACTIVE");
      const selectedParty=parties.find(row=>row.id===state.cndnPartyId);
      if(selectedParty?.type==="CUSTOMER")state.cndnLedgerSide=LEDGER_SIDE.CUSTOMER;
      if(selectedParty?.type==="SUPPLIER")state.cndnLedgerSide=LEDGER_SIDE.SUPPLIER;
      const allowedSides=selectedParty?.type==="CUSTOMER"?[LEDGER_SIDE.CUSTOMER]:selectedParty?.type==="SUPPLIER"?[LEDGER_SIDE.SUPPLIER]:[LEDGER_SIDE.CUSTOMER,LEDGER_SIDE.SUPPLIER];
      if(!allowedSides.includes(state.cndnLedgerSide))state.cndnLedgerSide=allowedSides[0];
      const defaultEffect=(type="CN",side=state.cndnLedgerSide)=>side===LEDGER_SIDE.CUSTOMER?(type==="CN"?"DECREASE":"INCREASE"):(type==="CN"?"INCREASE":"DECREASE");
      return `<div class="page">${pageHeader("CN / DN","Post notes to the correct customer or supplier ledger and keep P&L aligned.",datePresetControl(state.cndnPreset,"cndn-preset",true))}
        ${state.cndnPreset==="custom"?`<div class="card card-pad" style="margin-bottom:16px"><div class="grid grid-2"><div class="field"><label>From</label><input class="input" type="date" id="cndn-from" value="${attr(range.from)}"></div><div class="field"><label>To</label><input class="input" type="date" id="cndn-to" value="${attr(range.to)}"></div></div></div>`:""}
        <div class="grid grid-3">
          <section class="card"><div class="card-head"><h3>New entry</h3></div><div class="card-body"><form id="cndn-form">
            <div class="grid grid-2"><div class="field"><label>Date <span class="required">*</span></label><input class="input" type="date" name="date" value="${localDateISO()}" required></div><div class="field"><label>Type <span class="required">*</span></label><select class="select" name="type" id="cndn-type"><option value="CN">Credit Note (CN)</option><option value="DN">Debit Note (DN)</option></select></div></div>
            <div class="field"><label>CN / DN Number</label><input class="input" name="noteNumber" placeholder="Auto generated if blank"></div>
            <div class="field"><label>Party <span class="required">*</span></label><select class="select" name="partyId" id="cndn-party" required>${options(parties,state.cndnPartyId,row=>row.name+" · "+row.code,"Choose party")}</select></div>
            <div class="field"><label>Post To <span class="required">*</span></label><select class="select" name="ledgerSide" id="cndn-ledger-side" required>${allowedSides.map(side=>`<option value="${side}" ${state.cndnLedgerSide===side?"selected":""}>${esc(ledgerSideLabel(side))}</option>`).join("")}</select><div class="help">A Both-type party keeps customer receivable and supplier payable separate.</div></div>
            <div class="grid grid-2"><div class="field"><label>Amount <span class="required">*</span></label><input class="input" type="number" step=".01" min=".01" name="amount" placeholder="0.00" required></div><div class="field"><label>P&amp;L Effect <span class="required">*</span></label><select class="select" name="effect" id="cndn-effect"><option value="INCREASE" ${defaultEffect()==="INCREASE"?"selected":""}>Increase profit</option><option value="DECREASE" ${defaultEffect()==="DECREASE"?"selected":""}>Reduce profit</option></select><div class="help">Suggested automatically from note type and ledger side.</div></div></div>
            <div class="field"><label>Reference</label><input class="input" name="reference" placeholder="Invoice, scheme or voucher reference"></div>
            <div class="field"><label>Remarks</label><textarea class="textarea" name="remarks" placeholder="Optional details"></textarea></div>
            <button class="btn btn-primary" style="width:100%" type="submit">Save CN / DN</button>
          </form></div></section>
          <section class="card span-2"><div class="card-head"><div><h3>CN / DN history</h3><div class="cell-sub">${dateFmt(range.from)} – ${dateFmt(range.to)}</div></div><div style="text-align:right"><span class="cell-sub">Net P&amp;L adjustment</span><strong class="${adjustment<0?"negative":"positive"}" style="display:block">${adjustment<0?"− ":"+ "}${money(Math.abs(adjustment))}</strong></div></div>
            <div class="toolbar"><span class="badge">${rows.length} entries</span><div class="toolbar-spacer"></div><button class="btn btn-sm" data-action="export-cndn">${icon("download")}CSV Export</button></div>
            ${rows.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Number</th><th>Party</th><th>Ledger</th><th>Effect</th><th>Amount</th><th>Reference</th><th>Remarks</th></tr></thead><tbody>${capRows(rows).map(row=>`<tr><td>${dateFmt(row.date)}</td><td><span class="badge ${row.type==="CN"?"badge-info":"badge-warning"}">${row.type}</span></td><td class="cell-main">${esc(row.noteNumber)}</td><td>${esc(row.partyName)}</td><td>${esc(ledgerSideLabel(row.ledgerSide))}</td><td><span class="${row.effect==="INCREASE"?"positive":"negative"}">${row.effect==="INCREASE"?"Increase":"Reduce"}</span></td><td class="money ${row.effect==="INCREASE"?"positive":"negative"}">${money(row.amount)}</td><td>${esc(row.reference||"—")}</td><td>${esc(row.remarks||"—")}</td></tr>`).join("")}</tbody></table></div>${capNote(rows,"notes")}`:emptyState("No CN / DN entries","Add the first note using the simple form.","note")}
          </section>
        </div>
      </div>`;
    };

    // Collection, payment, outstanding and party ledger
    const getFilteredMoneyTransactions = db => {
      const f=state.moneyFilters,needle=lower(state.moneySearch);
      return (db.payments||[]).filter(row=>(!f.from||row.date>=f.from)&&(!f.to||row.date<=f.to)&&(!f.type||row.type===f.type)&&(!f.partyId||row.partyId===f.partyId)&&(!f.status||row.status===f.status)&&(!needle||[row.voucherNumber,row.partyName,row.reference,row.remarks,paymentModeLabel(row.mode)].some(value=>lower(value).includes(needle)))).sort((a,b)=>String(b.date+b.createdAt).localeCompare(String(a.date+a.createdAt)));
    };
    const renderMoneyEntry = (db,type) => {
      const isCollection=type===MONEY_TX_TYPE.COLLECTION;
      const parties=db.parties.filter(row=>row.status==="ACTIVE"&&(isCollection?["CUSTOMER","BOTH"]:["SUPPLIER","BOTH"]).includes(row.type)).sort((a,b)=>a.name.localeCompare(b.name));
      if(state.moneyPartyId&&!parties.some(row=>row.id===state.moneyPartyId)){state.moneyPartyId="";state.moneyPartySearch="";}
      const selected=parties.find(row=>row.id===state.moneyPartyId),account=selected?partyAccount(db,selected.id,localDateISO()):null;
      const balance=account?(isCollection?account.receivable:account.payable):0;
      const prefix=isCollection?"RCT":"PAY",voucher=nextDocumentPreview(db.payments.filter(row=>row.type===type),prefix,"voucherNumber");
      return `<div class="grid grid-3"><section class="card span-2"><div class="card-head"><div><h3>${isCollection?"Post Customer Collection":"Post Supplier Payment"}</h3><div class="cell-sub">Voucher is audit-logged; corrections are made by voiding the voucher.</div></div><span class="badge ${isCollection?"badge-success":"badge-warning"}">${isCollection?"Money In":"Money Out"}</span></div><div class="card-body">
        <form id="money-form"><input type="hidden" name="type" value="${type}"><input type="hidden" name="partyId" value="${attr(selected?.id||"")}"><div class="grid grid-3">
          <div class="field"><label>Date <span class="required">*</span></label><input class="input" type="date" name="date" value="${localDateISO()}" required></div>
          <div class="field"><label>Voucher Number</label><input class="input" name="voucherNumber" value="${attr(voucher)}"><div class="help">Auto-generated; editable before posting.</div></div>
          <div class="field"><label>Payment Mode <span class="required">*</span></label><select class="select" name="mode" required>${PAYMENT_MODES.map(mode=>`<option value="${mode}">${esc(paymentModeLabel(mode))}</option>`).join("")}</select></div>
          <div class="field span-2 autocomplete"><label>${isCollection?"Customer / Dealer":"Supplier"} <span class="required">*</span></label>${selected?`<div class="selected-party"><div><h3>${esc(selected.name)}</h3><p>${esc(selected.code)} · ${esc(selected.mobile||"No mobile")} · ${esc(selected.area||"No area")}</p></div><button class="btn btn-sm" type="button" data-action="change-money-party">Change</button></div>`:`<div class="input-icon"><span data-icon="search"></span><input class="input" id="money-party-search" value="${attr(state.moneyPartySearch)}" autocomplete="off" placeholder="Search ${isCollection?"customer / dealer":"supplier"} name, code or mobile"></div><div id="money-party-suggestions"></div><div class="help">Type a party name, code, mobile, GSTIN or area, then select the correct ledger.</div>`}</div>
          <div class="field"><label>Amount <span class="required">*</span></label><input class="input money" type="number" min=".01" step=".01" name="amount" placeholder="0.00" required></div>
          <div class="field"><label>Bank / UTR / Cheque Reference</label><input class="input" name="reference" placeholder="Optional reference"></div>
          <div class="field span-2"><label>Remarks</label><textarea class="textarea" name="remarks" placeholder="Optional narration"></textarea></div>
        </div>${selected?`<div class="callout" style="margin-bottom:14px"><strong>${esc(selected.name)}</strong> · Current ${isCollection?"receivable":"payable"}: <strong class="${balance>0?"negative":"positive"}">${ledgerBalanceText(balance,isCollection?LEDGER_SIDE.CUSTOMER:LEDGER_SIDE.SUPPLIER)}</strong>${balance<0?" · Existing advance":""}</div>`:`<div class="callout" style="margin-bottom:14px">Search and select a party to see its current balance before posting.</div>`}<div class="inline-actions" style="justify-content:flex-end"><button class="btn btn-primary" type="submit" ${selected?"":"disabled"}>${icon(isCollection?"collection":"outstanding")}${isCollection?"Post Collection":"Post Payment"}</button></div></form>
      </div></section><aside class="card"><div class="card-head"><h3>Posting Rule</h3></div><div class="card-body"><div class="detail-grid" style="grid-template-columns:1fr"><div class="detail"><span>Ledger</span><strong>${isCollection?"Customer Receivable":"Supplier Payable"}</strong></div><div class="detail"><span>Effect</span><strong>${isCollection?"Reduces customer due":"Reduces supplier due"}</strong></div><div class="detail"><span>Cash Sales</span><strong>Excluded</strong><small>Direct cash invoices are treated as settled and do not create party outstanding.</small></div></div></div></aside></div>`;
    };
    const renderMoneyHistory = db => {
      const rows=getFilteredMoneyTransactions(db),f=state.moneyFilters;
      return `<section class="card"><div class="toolbar"><div class="field" style="flex:1;min-width:220px"><label>Search</label><div class="input-icon"><span data-icon="search"></span><input class="input" id="money-search" value="${attr(state.moneySearch)}" placeholder="Voucher, party, reference or remarks"></div></div><div class="field"><label>From</label><input class="input" type="date" data-money-filter="from" value="${attr(f.from)}"></div><div class="field"><label>To</label><input class="input" type="date" data-money-filter="to" value="${attr(f.to)}"></div><div class="field"><label>Type</label><select class="select" data-money-filter="type"><option value="">All</option><option value="COLLECTION" ${f.type===MONEY_TX_TYPE.COLLECTION?"selected":""}>Collection</option><option value="PAYMENT" ${f.type===MONEY_TX_TYPE.PAYMENT?"selected":""}>Payment</option></select></div><div class="field"><label>Party</label><select class="select" data-money-filter="partyId">${options(db.parties,f.partyId,row=>row.name,"All parties")}</select></div><div class="field"><label>Status</label><select class="select" data-money-filter="status"><option value="">All</option><option value="POSTED" ${f.status===MONEY_STATUS.POSTED?"selected":""}>Posted</option><option value="VOIDED" ${f.status===MONEY_STATUS.VOIDED?"selected":""}>Voided</option></select></div><button class="btn btn-sm" style="align-self:flex-end" data-action="export-money">${icon("download")}CSV Export</button></div>
        ${rows.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Voucher</th><th>Type</th><th>Party</th><th>Mode</th><th>Reference</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>${capRows(rows).map(row=>`<tr><td>${dateFmt(row.date)}</td><td class="cell-main">${esc(row.voucherNumber)}</td><td><span class="badge ${row.type===MONEY_TX_TYPE.COLLECTION?"badge-success":"badge-warning"}">${row.type===MONEY_TX_TYPE.COLLECTION?"Collection":"Payment"}</span></td><td><div class="cell-main">${esc(row.partyName)}</div><div class="cell-sub">${esc(row.partySnapshot?.code||"")}</div></td><td>${esc(paymentModeLabel(row.mode))}</td><td>${esc(row.reference||"—")}</td><td class="money ${row.type===MONEY_TX_TYPE.COLLECTION?"positive":""}">${money(row.amount)}</td><td>${statusBadge(row.status)}</td><td><div class="inline-actions"><button class="btn btn-sm" data-action="view-money" data-id="${row.id}">View</button><button class="btn btn-sm" data-action="open-ledger" data-id="${row.partyId}" data-side="${row.type===MONEY_TX_TYPE.COLLECTION?LEDGER_SIDE.CUSTOMER:LEDGER_SIDE.SUPPLIER}">Ledger</button>${row.status===MONEY_STATUS.POSTED?`<button class="btn btn-sm btn-danger-soft" data-action="void-money" data-id="${row.id}">Void</button>`:""}</div></td></tr>`).join("")}</tbody></table></div>${capNote(rows,"vouchers")}`:emptyState("No collection or payment vouchers","Post a customer collection or supplier payment to start the ledger history.","collection")}</section>`;
    };
    const renderMoney = async db => {
      const tabBar=tabs([{id:"collection",label:"New Collection"},{id:"payment",label:"New Payment"},{id:"history",label:"Voucher History"}],state.moneyTab,"money-tab");
      const content=state.moneyTab==="history"?renderMoneyHistory(db):renderMoneyEntry(db,state.moneyTab==="payment"?MONEY_TX_TYPE.PAYMENT:MONEY_TX_TYPE.COLLECTION);
      return `<div class="page">${pageHeader("Collection / Payment","Post party-wise money receipts and supplier payments with an auditable voucher trail.")}${tabBar}${content}</div>`;
    };

    const getOutstandingRows = db => {
      const asOf=state.outstandingAsOf||localDateISO(),needle=lower(state.outstandingSearch),type=state.outstandingType;
      return buildPartyAccounts(db,asOf).filter(row=>row.hasActivity&&(!needle||[row.partyName,row.partyCode,row.mobile,row.area].some(value=>lower(value).includes(needle)))&&(type==="ALL"||type==="DUE"&&(row.receivable>.005||row.payable>.005)||type==="RECEIVABLE"&&row.receivable>.005||type==="PAYABLE"&&row.payable>.005||type==="ADVANCE"&&(row.receivable<-.005||row.payable<-.005))).sort((a,b)=>Math.max(b.receivable,b.payable)-Math.max(a.receivable,a.payable));
    };
    const renderOutstanding = async db => {
      const asOf=state.outstandingAsOf||localDateISO(),all=buildPartyAccounts(db,asOf),rows=getOutstandingRows(db);
      const receivable=sum(all,row=>Math.max(0,row.receivable)),payable=sum(all,row=>Math.max(0,row.payable)),customerAdvance=sum(all,row=>Math.max(0,-row.receivable)),supplierAdvance=sum(all,row=>Math.max(0,-row.payable));
      return `<div class="page">${pageHeader("Outstanding","Live party balances from opening balance, bills, returns, CN/DN and posted collection/payment vouchers.",`<button class="btn" data-action="export-outstanding">${icon("download")}CSV Export</button>`)}
        <div class="kpi-grid">${kpiCard("Total Receivable",money(receivable),"Customer / dealer due","negative")}${kpiCard("Total Payable",money(payable),"Supplier due","negative")}${kpiCard("Customer Advance",money(customerAdvance),"Credit balance with customers","positive")}${kpiCard("Supplier Advance",money(supplierAdvance),"Advance paid to suppliers","positive")}${kpiCard("Net Position",money(receivable-payable),receivable>=payable?"Net receivable":"Net payable",receivable>=payable?"positive":"negative")}</div>
        <div class="callout" style="margin-bottom:16px"><strong>Actual balance rule:</strong> invoice value includes GST; posted returns, CN/DN and collection/payment vouchers are adjusted up to the selected date. Direct / Cash Sale invoices are treated as settled and excluded from party outstanding.</div>
        <section class="card"><div class="toolbar"><div class="field" style="flex:1;min-width:230px"><label>Search Party</label><div class="input-icon"><span data-icon="search"></span><input class="input" id="outstanding-search" value="${attr(state.outstandingSearch)}" placeholder="Party name, code, mobile or area"></div></div><div class="field"><label>As On</label><input class="input" type="date" id="outstanding-as-of" value="${attr(asOf)}"></div><div class="field"><label>View</label><select class="select" id="outstanding-type"><option value="DUE" ${state.outstandingType==="DUE"?"selected":""}>Current Due</option><option value="RECEIVABLE" ${state.outstandingType==="RECEIVABLE"?"selected":""}>Receivable Only</option><option value="PAYABLE" ${state.outstandingType==="PAYABLE"?"selected":""}>Payable Only</option><option value="ADVANCE" ${state.outstandingType==="ADVANCE"?"selected":""}>Advance Balances</option><option value="ALL" ${state.outstandingType==="ALL"?"selected":""}>All With Activity</option></select></div></div>
          ${rows.length?`<div class="table-wrap"><table><thead><tr><th>Party / Ledger</th><th>Sales / Opening</th><th>Sales Return / CN</th><th>Collection</th><th>Receivable</th><th>Purchase / Opening</th><th>Purchase Return / CN</th><th>Payment</th><th>Payable</th><th>Position</th><th>Actions</th></tr></thead><tbody>${capRows(rows).map(row=>`<tr><td><div class="cell-main">${esc(row.partyName)}</div><div class="cell-sub">${esc(row.partyCode)} · ${esc(statusLabel(row.partyType))} · ${esc(row.mobile||"No mobile")}</div></td><td><div class="money">${money(row.customerOpening+row.salesBilled+row.customerDN)}</div><div class="cell-sub">Bills ${money(row.salesBilled)} · Opening ${money(row.customerOpening)} · DN ${money(row.customerDN)}</div></td><td><div class="money">${money(row.salesReturns+row.customerCN)}</div><div class="cell-sub">Return ${money(row.salesReturns)} · CN ${money(row.customerCN)}</div></td><td class="money positive">${money(row.collections)}</td><td class="money ${row.receivable>0?"negative":"positive"}"><strong>${ledgerBalanceText(row.receivable,LEDGER_SIDE.CUSTOMER)}</strong></td><td><div class="money">${money(row.supplierOpening+row.purchasesBilled+row.supplierDN)}</div><div class="cell-sub">Bills ${money(row.purchasesBilled)} · Opening ${money(row.supplierOpening)} · DN ${money(row.supplierDN)}</div></td><td><div class="money">${money(row.purchaseReturns+row.supplierCN)}</div><div class="cell-sub">Return ${money(row.purchaseReturns)} · CN ${money(row.supplierCN)}</div></td><td class="money">${money(row.paymentsMade)}</td><td class="money ${row.payable>0?"negative":"positive"}"><strong>${ledgerBalanceText(row.payable,LEDGER_SIDE.SUPPLIER)}</strong></td><td><div class="cell-main">${esc(partyPositionText(row))}</div><div class="cell-sub">Net ${row.netPosition>=0?"Receivable":"Payable"} ${money(Math.abs(row.netPosition))}</div></td><td><div class="inline-actions"><button class="btn btn-sm" data-action="open-ledger" data-id="${row.partyId}">Ledger</button>${["CUSTOMER","BOTH"].includes(row.partyType)?`<button class="btn btn-sm" data-action="open-collection" data-id="${row.partyId}">Collect</button>`:""}${["SUPPLIER","BOTH"].includes(row.partyType)?`<button class="btn btn-sm" data-action="open-payment" data-id="${row.partyId}">Pay</button>`:""}</div></td></tr>`).join("")}</tbody></table></div>${capNote(rows,"parties")}`:emptyState("No matching outstanding","Change the view or search, or post bills and collection/payment vouchers.","outstanding")}
        </section></div>`;
    };

    const renderLedger = async db => {
      const party=db.parties.find(row=>row.id===state.ledgerPartyId);
      const headActions=`<button class="btn" data-action="export-ledger" ${party?"":"disabled"}>${icon("download")}CSV</button><button class="btn" data-action="print-ledger" ${party?"":"disabled"}>${icon("print")}Print</button><button class="btn btn-primary" data-action="add-party">${icon("plus")}New Party / Ledger</button>`;
      if(!party){
        const needle=lower(state.ledgerPartySearch),accounts=new Map(buildPartyAccounts(db,localDateISO()).map(row=>[row.partyId,row]));
        const directory=db.parties.map(partyRow=>({party:partyRow,account:accounts.get(partyRow.id)||{receivable:0,payable:0}})).filter(row=>!needle||[row.party.name,row.party.code,row.party.mobile,row.party.gstin,row.party.area,row.party.address,statusLabel(row.party.type)].some(value=>lower(value).includes(needle))).sort((a,b)=>(a.party.status==="ACTIVE"?0:1)-(b.party.status==="ACTIVE"?0:1)||a.party.name.localeCompare(b.party.name));
        return `<div class="page">${pageHeader("Ledger View","All party and supplier ledgers are shown below. Search filters this full list.",headActions)}<section class="card"><div class="toolbar"><div><strong>Ledger Directory</strong><div class="cell-sub">${directory.length} of ${db.parties.length} ledgers shown</div></div><div class="toolbar-spacer"></div><div class="field" style="flex:1;min-width:260px;max-width:520px"><label>Filter Ledger Names</label><div class="input-icon"><span data-icon="search"></span><input class="input" id="ledger-party-search" value="${attr(state.ledgerPartySearch)}" autocomplete="off" placeholder="Search name, code, mobile, GSTIN or area"></div></div></div>${directory.length?`<div class="table-wrap" id="ledger-directory-table"><table><thead><tr><th>Ledger Name</th><th>Type / Status</th><th>Contact</th><th>Receivable</th><th>Payable</th><th>Current Position</th><th>Action</th></tr></thead><tbody>${directory.map(row=>`<tr><td><div class="cell-main">${esc(row.party.name)}</div><div class="cell-sub">${esc(row.party.code)}</div></td><td><div class="cell-main">${esc(statusLabel(row.party.type))}</div><div class="cell-sub">${statusBadge(row.party.status)}</div></td><td><div class="cell-main">${esc(row.party.mobile||"No mobile")}</div><div class="cell-sub">${esc(row.party.area||row.party.gstin||"No area / GSTIN")}</div></td><td class="money">${["CUSTOMER","BOTH"].includes(row.party.type)?ledgerBalanceText(row.account.receivable,LEDGER_SIDE.CUSTOMER):"—"}</td><td class="money">${["SUPPLIER","BOTH"].includes(row.party.type)?ledgerBalanceText(row.account.payable,LEDGER_SIDE.SUPPLIER):"—"}</td><td><div class="cell-main">${esc(partyPositionText(row.account))}</div></td><td><button class="btn btn-sm btn-primary" data-action="select-ledger-party" data-id="${row.party.id}">${icon("ledger")}Open Ledger</button></td></tr>`).join("")}</tbody></table></div>`:emptyState(state.ledgerPartySearch?"No matching ledger":"No ledgers yet",state.ledgerPartySearch?"Try another name, code, mobile, GSTIN or area.":"Create the first party or supplier ledger.","ledger")}</section></div>`;
      }
      if(party.type==="SUPPLIER")state.ledgerSide=LEDGER_SIDE.SUPPLIER;
      else if(party.type==="CUSTOMER")state.ledgerSide=LEDGER_SIDE.CUSTOMER;
      const side=state.ledgerSide===LEDGER_SIDE.SUPPLIER?LEDGER_SIDE.SUPPLIER:LEDGER_SIDE.CUSTOMER;
      const effectiveTo=state.ledgerTo||localDateISO(),ledger=buildPartyLedger(db,party.id,side,state.ledgerFrom,effectiveTo),needle=lower(state.ledgerSearch);
      const rows=ledger.events.filter(row=>!needle||[row.particulars,row.voucher,row.reference].some(value=>lower(value).includes(needle)));
      const account=partyAccount(db,party.id,localDateISO());
      return `<div class="page">${pageHeader("Ledger View","Complete party activity with running Dr / Cr balance and transaction drill-down.",headActions)}
        <section class="card" style="margin-bottom:16px"><div class="card-body"><div class="selected-party"><div><h3>${esc(party.name)}</h3><p>${esc(party.code)} · ${esc(statusLabel(party.type))} · ${esc(party.mobile||"No mobile")} · ${esc(party.gstin||"No GSTIN")}</p><p>${esc(party.address||party.area||"")}</p></div><div class="inline-actions"><button class="btn btn-sm" data-action="edit-ledger-party" data-id="${party.id}">Edit Party</button><button class="btn btn-sm" data-action="change-ledger-party">Change Ledger</button></div></div><div class="inline-actions" style="margin-top:14px;flex-wrap:wrap">${["CUSTOMER","BOTH"].includes(party.type)?`<button class="btn btn-sm" data-action="open-party-sale" data-id="${party.id}">${icon("sales")}New Sale</button><button class="btn btn-sm" data-action="open-collection" data-id="${party.id}">${icon("collection")}New Collection</button>`:""}${["SUPPLIER","BOTH"].includes(party.type)?`<button class="btn btn-sm" data-action="open-party-purchase" data-id="${party.id}">${icon("purchase")}New Purchase</button><button class="btn btn-sm" data-action="open-payment" data-id="${party.id}">${icon("outstanding")}New Payment</button>`:""}<button class="btn btn-sm" data-action="open-party-return" data-side="${side}">${icon("returns")}New Return</button><button class="btn btn-sm" data-action="open-party-cndn" data-id="${party.id}" data-side="${side}">${icon("note")}New CN / DN</button></div></div></section>
        ${party.type==="BOTH"?`<div class="segmented" style="margin-bottom:16px"><button class="${side===LEDGER_SIDE.CUSTOMER?"active":""}" data-action="ledger-side" data-side="CUSTOMER">Customer Receivable Ledger</button><button class="${side===LEDGER_SIDE.SUPPLIER?"active":""}" data-action="ledger-side" data-side="SUPPLIER">Supplier Payable Ledger</button></div>`:""}
        <div class="kpi-grid">${kpiCard("Current Receivable",ledgerBalanceText(account?.receivable||0,LEDGER_SIDE.CUSTOMER),"Sales − returns − collection ± CN/DN",account?.receivable>0?"negative":"positive")}${kpiCard("Current Payable",ledgerBalanceText(account?.payable||0,LEDGER_SIDE.SUPPLIER),"Purchase − returns − payment ± CN/DN",account?.payable>0?"negative":"positive")}${kpiCard("Period Opening",ledgerBalanceText(ledger.opening,side),ledgerSideLabel(side))}${kpiCard("Period Debit",money(ledger.totalDebit),"Selected date range")}${kpiCard("Period Credit",money(ledger.totalCredit),"Selected date range")}${kpiCard("Closing Balance",ledgerBalanceText(ledger.closing,side),ledger.closing>=0?"Amount due":"Advance balance",ledger.closing>0?"negative":"positive")}</div>
        <section class="card"><div class="toolbar"><div class="field" style="flex:1;min-width:220px"><label>Search Ledger</label><div class="input-icon"><span data-icon="search"></span><input class="input" id="ledger-search" value="${attr(state.ledgerSearch)}" placeholder="Particulars, voucher or reference"></div></div><div class="field"><label>From</label><input class="input" type="date" id="ledger-from" value="${attr(state.ledgerFrom)}"></div><div class="field"><label>To</label><input class="input" type="date" id="ledger-to" value="${attr(effectiveTo)}"></div><span class="badge badge-info" style="align-self:flex-end">${esc(ledgerSideLabel(side))}</span></div>
          ${rows.length>LIST_LIMIT?`<div class="pagination"><span>Showing the most recent ${LIST_LIMIT} of ${number(rows.length)} entries. Narrow the date range, or export the full ledger to CSV.</span></div>`:""}<div class="table-wrap"><table><thead><tr><th>Date</th><th>Particulars</th><th>Voucher</th><th>Reference / Narration</th><th>Debit</th><th>Credit</th><th>Running Balance</th><th>Action</th></tr></thead><tbody><tr><td>${state.ledgerFrom?dateFmt(state.ledgerFrom):"—"}</td><td class="cell-main">Opening Balance</td><td>—</td><td>Balance brought forward</td><td>—</td><td>—</td><td class="money"><strong>${ledgerBalanceText(ledger.opening,side)}</strong></td><td></td></tr>${(rows.length>LIST_LIMIT?rows.slice(-LIST_LIMIT):rows).map(row=>`<tr><td>${dateFmt(row.date)}</td><td><div class="cell-main">${esc(row.particulars)}</div><div class="cell-sub">${esc(statusLabel(row.kind))}</div></td><td class="cell-main">${esc(row.voucher)}</td><td>${esc(row.reference||"—")}</td><td class="money">${row.debit?money(row.debit):"—"}</td><td class="money">${row.credit?money(row.credit):"—"}</td><td class="money ${row.balance>0?"negative":"positive"}"><strong>${ledgerBalanceText(row.balance,side)}</strong></td><td><button class="btn btn-sm" data-action="view-ledger-source" data-kind="${row.kind}" data-id="${row.sourceId}">View</button></td></tr>`).join("")}<tr><th colspan="4">Period Total / Closing</th><th class="money">${money(ledger.totalDebit)}</th><th class="money">${money(ledger.totalCredit)}</th><th class="money">${ledgerBalanceText(ledger.closing,side)}</th><th></th></tr></tbody></table></div>${!rows.length?`<div class="callout" style="margin:14px">No ledger transactions match this date range or search. Opening balance is still shown.</div>`:""}</section></div>`;
    };

    // Reports
    const reportTypes = [
      ["purchase-report","Purchase Report"],["sales-report","Sales Report"],["current-stock","Current Stock"],
      ["imei-stock","IMEI Stock"],["imei-history","IMEI History"],["activation-report","Activation Report"],["unmatched-activation","Unmatched Activation Report"],
      ["brand-stock","Brand Stock"],["model-stock","Model Stock"],["stock-aging","Serial / IMEI Stock Aging"],
      ["purchase-return","Purchase Return"],["sales-return","Sales Return"],["expense-report","Expense Report"],["cndn-report","CN / DN Report"],
      ["collection-payment-report","Collection / Payment Report"],["party-outstanding","Party Outstanding (As On)"],
      ["gross-profit","Gross Profit"],["pnl","P&L"],["brand-profit","Brand-wise Profit"],["model-profit","Model-wise Profit"]
    ];
    const buildReport = (db,type,from,to) => {
      const maps=getMaps(db), owned=db.inventory.filter(row=>[STATUS.IN_STOCK,STATUS.DAMAGED].includes(row.stockStatus)),stockSummary=buildStockGroups(db);
      const finance=financialFromDb(db,from,to);
      let rows=[];
      if(type==="purchase-report") db.purchases.filter(row=>inRange(row.invoiceDate,from,to)).forEach(purchase=>purchase.items.forEach(item=>rows.push({
        Date:purchase.invoiceDate,Invoice:purchase.invoiceNumber,Supplier:purchase.supplierName,Tracking:item.trackingMode===TRACKING_MODE.QUANTITY?"Quantity Only":"Serial / IMEI","Serial / IMEI":item.imei||"",Quantity:Number(item.qty||1),
        Brand:maps.brands.get(item.brandId)?.name||item.brandName||"",Product:productMasterName(maps.models.get(item.modelId)),
        "Purchase Rate":item.purchaseRate,"GST %":item.gst,"Taxable Value":Number(item.purchaseRate||0)*Number(item.qty||1),"GST Amount":Number(item.purchaseRate||0)*Number(item.qty||1)*Number(item.gst||0)/100,"Line Total":purchaseLineGross(item),Status:purchase.status
      })));
      else if(type==="sales-report") db.sales.filter(row=>inRange(row.invoiceDate,from,to)).forEach(sale=>sale.items.forEach(item=>rows.push({
        Date:sale.invoiceDate,"Invoice / Tally Ref":sale.invoiceNumber,"Customer Type":customerTypeLabel(sale),"Billing Source":saleModeLabel(sale),"Sale Type":saleTypeLabel(sale.saleType),"Customer / Buyer":sale.customerName,"Customer Mobile":sale.customerMobile||"","Customer Address":sale.customerSnapshot?.address||"","Customer Area":sale.customerSnapshot?.area||"","Customer GSTIN":sale.customerGSTIN||"",Tracking:item.trackingMode===TRACKING_MODE.QUANTITY?"Quantity Only":"Serial / IMEI","Serial / IMEI":item.imei||"",Quantity:Number(item.qty||1),Brand:item.brandName||maps.brands.get(item.brandId)?.name||"",
        Product:productMasterName(maps.models.get(item.modelId)),"Master Rate":item.masterRate??item.rate,Rate:item.rate,"Price Override":item.priceOverridden?"Yes":"No","Override Reason":sale.priceOverrideReason||"","Taxable Value":item.taxableValue,
        GST:item.gstAmount,"Grand Total":item.lineTotal,Status:sale.status
      })));
      else if(type==="current-stock") rows=stockSummary.products.map(item=>({Brand:item.brandName,Product:item.productName,Tracking:item.trackingMode===TRACKING_MODE.QUANTITY?"Quantity Only":"Serial / IMEI",Available:item.inStock,Damaged:item.damaged,Quantity:item.total,"Stock Value":item.stockValue}));
      else if(type==="imei-stock") db.inventory.forEach(item=>{const p=productName(item,maps);rows.push({
        IMEI:item.imei,Brand:p.brand,Product:p.model,"Purchase Date":item.purchaseDate,"Purchase Rate":item.purchaseRate,Supplier:item.supplierName,"Stock Age":daysOld(item.purchaseDate),"Activation Status":statusLabel(item.activation?.status||"NOT_ACTIVATED"),"Inventory Status":statusLabel(item.stockStatus)
      });});
      else if(type==="imei-history") db.inventory.forEach(item=>{const p=productName(item,maps);const lastReturn=item.returnHistory?.at(-1);rows.push({
        IMEI:item.imei,Product:p.text,Purchase:item.purchaseInvoice,"Purchase Date":item.purchaseDate,Activation:statusLabel(item.activation?.status||"NOT_ACTIVATED"),
        Sale:item.saleInvoice||item.saleHistory?.at(-1)?.saleInvoice||"",Return:lastReturn?.type?statusLabel(lastReturn.type):"",Status:statusLabel(item.stockStatus)
      });});
      else if(type==="activation-report") db.inventory.forEach(item=>{const p=productName(item,maps);rows.push({
        IMEI:item.imei,Brand:p.brand,Product:p.model,"Customer Type":customerTypeLabel({customerType:activationCustomerType(item)}),"Customer / Buyer":activationParty(item),"Customer Mobile":activationMobile(item),"Sale Date":item.saleDate||latestSaleHistory(item)?.saleDate||"",
        "Activation Date":item.activation?.activationDate||"","Activation Status":statusLabel(item.activation?.status||"NOT_ACTIVATED"),
        "Current Status":statusLabel(item.stockStatus)
      });});
      else if(type==="unmatched-activation") rows=db.unmatchedActivations.map(row=>({
        IMEI:row.imei,"Activation Date":row.activationDate,"Source File":row.sourceFile,"Imported At":row.importedAt,Reason:row.reason
      }));
      else if(type==="brand-stock"||type==="model-stock"){
        const groups=new Map();
        stockSummary.products.forEach(item=>{const key=type==="brand-stock"?item.brandId:item.modelId,name=type==="brand-stock"?item.brandName:item.brandName+" "+item.productName;
          if(!groups.has(key))groups.set(key,{Name:name,Quantity:0,"Stock Value":0,Available:0,Damaged:0});
          const row=groups.get(key);row.Quantity+=item.total;row["Stock Value"]+=item.stockValue;row.Available+=item.inStock;row.Damaged+=item.damaged;
        });rows=[...groups.values()].map(row=>type==="brand-stock"?{Brand:row.Name,...Object.fromEntries(Object.entries(row).filter(([key])=>key!=="Name"))}:{Product:row.Name,...Object.fromEntries(Object.entries(row).filter(([key])=>key!=="Name"))});
      }
      else if(type==="stock-aging"){
        const labels=["0–7 Days","8–15 Days","16–30 Days","31–60 Days","61–90 Days","90+ Days"];
        rows=labels.map(label=>{const items=owned.filter(row=>agingBucket(daysOld(row.purchaseDate))===label);return {Bucket:label,Quantity:items.length,"Stock Value":sum(items,row=>row.purchaseRate)};});
      }
      else if(type==="purchase-return"||type==="sales-return") db.returns.filter(row=>row.type===(type==="purchase-return"?"PURCHASE_RETURN":"SALES_RETURN")&&inRange(row.returnDate,from,to)).forEach(row=>rows.push({
        Date:row.returnDate,"Return ID":row.id,"Customer Type":row.type==="SALES_RETURN"?customerTypeLabel(row):"Supplier","Party / Buyer":row.partyName,"Customer Mobile":row.customerMobile||"","Customer Address":row.customerAddress||"",Tracking:row.trackingMode===TRACKING_MODE.QUANTITY?"Quantity Only":"Serial / IMEI",Product:row.productName||"","Serial / IMEI":row.imei||"",Quantity:Number(row.quantity||1),"Original Invoice":row.originalInvoice,"Stock / P&L Value":row.value,"Ledger Value":returnLedgerValue(db,row),Outcome:statusLabel(row.outcome),Reason:row.reason,Remarks:row.remarks
      }));
      else if(type==="expense-report") rows=db.expenses.filter(row=>inRange(row.date,from,to)).map(row=>({Date:row.date,"Expense Head":row.expenseHead,Amount:row.amount,Reference:row.reference,Remarks:row.remarks}));
      else if(type==="cndn-report") rows=db.notes.filter(row=>inRange(row.date,from,to)).map(row=>({Date:row.date,Type:row.type,"CN / DN Number":row.noteNumber,Party:row.partyName,Ledger:ledgerSideLabel(row.ledgerSide),Effect:row.effect==="INCREASE"?"Increase Profit":"Reduce Profit",Amount:row.amount,"P&L Adjustment":row.effect==="INCREASE"?Number(row.amount):-Number(row.amount),Reference:row.reference,Remarks:row.remarks}));
      else if(type==="collection-payment-report") rows=(db.payments||[]).filter(row=>inRange(row.date,from,to)).map(row=>({Date:row.date,Voucher:row.voucherNumber,Type:moneyTypeLabel(row.type),Party:row.partyName,"Party Code":row.partySnapshot?.code||"",Mode:paymentModeLabel(row.mode),Reference:row.reference,Amount:row.amount,Status:statusLabel(row.status),Remarks:row.remarks,"Created By":row.createdBy,"Created At":row.createdAt}));
      else if(type==="party-outstanding") rows=buildPartyAccounts(db,to||localDateISO()).filter(row=>row.hasActivity).map(row=>({"As On":to||localDateISO(),"Party Code":row.partyCode,Party:row.partyName,Type:statusLabel(row.partyType),Mobile:row.mobile||"","Customer Opening":row.customerOpening,"Sales Bills":row.salesBilled,"Sales Return":row.salesReturns,"Customer CN":row.customerCN,"Customer DN":row.customerDN,Collection:row.collections,Receivable:row.receivable,"Supplier Opening":row.supplierOpening,"Purchase Bills":row.purchasesBilled,"Purchase Return":row.purchaseReturns,"Supplier CN":row.supplierCN,"Supplier DN":row.supplierDN,Payment:row.paymentsMade,Payable:row.payable,"Net Position":row.netPosition}));
      else if(type==="gross-profit") rows=finance.events.map(event=>({
        Date:event.date,Type:event.kind,"Invoice / Tally Ref":event.sale.invoiceNumber,"Customer Type":customerTypeLabel(event.sale),"Customer / Buyer":event.sale.customerName,"Customer Mobile":event.sale.customerMobile||"","Billing Source":saleModeLabel(event.sale),Tracking:event.line.trackingMode===TRACKING_MODE.QUANTITY?"Quantity Only":"Serial / IMEI",Product:event.line.modelName,"Serial / IMEI":event.line.imei||"",Quantity:event.qty,
        Sales:event.sales,Cost:event.cost,"Gross Profit":event.sales-event.cost,"Margin %":percent(event.sales-event.cost,event.sales).toFixed(2)
      }));
      else if(type==="pnl") rows=[{"Net Sales":finance.netSales,"Cost of Goods Sold":finance.cogs,"Gross Profit":finance.grossProfit,"GP %":percent(finance.grossProfit,finance.netSales).toFixed(2),Expenses:finance.expenses,"CN / DN Adjustment":finance.cnDnAdjustment,"Net Profit":finance.netProfit,"NP %":percent(finance.netProfit,finance.netSales).toFixed(2)}];
      else if(type==="brand-profit"||type==="model-profit"){
        const groups=new Map();
        finance.events.forEach(event=>{const key=type==="brand-profit"?event.line.brandId:event.line.modelId;const name=type==="brand-profit"?(event.line.brandName||maps.brands.get(key)?.name||"Unknown"):(event.line.brandName||maps.brands.get(event.line.brandId)?.name||"")+" "+(event.line.modelName||maps.models.get(key)?.name||"");
          if(!groups.has(key))groups.set(key,{Name:name,Quantity:0,Sales:0,Cost:0});const row=groups.get(key);row.Quantity+=Number(event.qty||0);row.Sales+=event.sales;row.Cost+=event.cost;
        });rows=[...groups.values()].map(row=>({[type==="brand-profit"?"Brand":"Model"]:row.Name,Quantity:row.Quantity,Sales:row.Sales,Cost:row.Cost,Profit:row.Sales-row.Cost,"Margin %":percent(row.Sales-row.Cost,row.Sales).toFixed(2)})).sort((a,b)=>b.Profit-a.Profit);
      }
      const title=reportTypes.find(row=>row[0]===type)?.[1]||"Report";
      return {title,rows};
    };
    const renderReports = async db => {
      const defaultRange=presetRange("month");
      const asOnReport=state.reportsType==="party-outstanding";
      const from=state.reportFrom||defaultRange.from,to=state.reportTo||(asOnReport?localDateISO():defaultRange.to);
      const report=buildReport(db,state.reportsType,from,to);
      const needle=lower(state.reportSearch);
      const filtered=report.rows.filter(row=>!needle||Object.values(row).some(value=>lower(value).includes(needle)));
      const columns=filtered[0]?Object.keys(filtered[0]):report.rows[0]?Object.keys(report.rows[0]):[];
      return `<div class="page">${pageHeader("Reports","One clean reporting workspace with search, date filters, CSV export and print.")}
        ${isTallyParallelMode(db.settings) ? `<div class="callout" style="margin-bottom:16px"><strong>Tally Parallel values are included.</strong> Reports use Product Master price, GST and the saved historical cost for each serial or quantity line.</div>` : ""}
        <section class="card">
          <div class="toolbar">
            <div class="field" style="min-width:245px"><label>Report</label><select class="select" id="report-type">${reportTypes.map(([id,label])=>`<option value="${id}" ${state.reportsType===id?"selected":""}>${esc(label)}</option>`).join("")}</select></div>
            ${asOnReport?"":`<div class="field"><label>From</label><input class="input" type="date" id="report-from" value="${attr(from)}"></div>`}
            <div class="field"><label>${asOnReport?"As On":"To"}</label><input class="input" type="date" id="report-to" value="${attr(to)}"></div>
            <div class="field" style="flex:1;min-width:190px"><label>Search</label><input class="input" id="report-search" value="${attr(state.reportSearch)}" placeholder="Search current report"></div>
            <div class="toolbar-spacer"></div><div class="inline-actions" style="align-self:flex-end"><button class="btn" data-action="export-report">${icon("download")}CSV</button><button class="btn btn-primary" data-action="print-report">${icon("print")}Print</button></div>
          </div>
          <div class="card-head"><div><h3>${esc(report.title)}</h3><div class="cell-sub">${asOnReport?"As on "+dateFmt(to):dateFmt(from)+" – "+dateFmt(to)}</div></div><span class="badge badge-info">${filtered.length} rows</span></div>
          <div id="report-table">${renderGenericReportTable(columns,filtered.slice(0,250))}</div>
          ${filtered.length>250?`<div class="pagination"><span>Showing first 250 rows. CSV export includes all ${filtered.length}.</span></div>`:""}
        </section>
      </div>`;
    };
    const MONEY_COLUMN_OVERRIDES={"Billing Source":false,"Return":false,"Customer CN":true,"Customer DN":true,"Supplier CN":true,"Supplier DN":true,"P&L Adjustment":true,"CN / DN Adjustment":true,"Expenses":true};
    const isMoneyColumn=key=>{
      if(Object.prototype.hasOwnProperty.call(MONEY_COLUMN_OVERRIDES,key))return MONEY_COLUMN_OVERRIDES[key];
      return ["rate","value","amount","sales","cost","profit","taxable","gst","total","opening","bill","return","collection","payment","receivable","payable","debit","credit","balance","position","expense","adjustment"].some(word=>lower(key).includes(word))&&!lower(key).includes("%");
    };
    const renderGenericReportTable=(columns,rows)=>rows.length?`<div class="table-wrap"><table><thead><tr>${columns.map(key=>`<th>${esc(key)}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${columns.map(key=>`<td class="${["IMEI","Serial / IMEI"].includes(key)?"mono":isMoneyColumn(key)?"money":""}">${isMoneyColumn(key)&&Number.isFinite(Number(row[key]))?money(row[key]):esc(row[key]??"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:emptyState("No report data","No records match this report and date range.","reports");

    // Profit & Loss
    const renderPnL = async db => {
      let range=presetRange(state.pnlPreset==="custom"?"month":state.pnlPreset);
      if(state.pnlPreset==="custom"){range.from=state.pnlFrom||localDateISO();range.to=state.pnlTo||localDateISO();}
      const finance=await dataService.getFinancials(range.from,range.to);
      const tabBar=tabs([{id:"summary",label:"Summary"},{id:"brand",label:"Brand-wise"},{id:"model",label:"Model-wise"}],state.pnlTab,"pnl-tab");
      let content;
      if(state.pnlTab==="summary") content=renderPnLSummary(finance);
      else content=renderPnLBreakdown(finance,state.pnlTab);
      return `<div class="page pnl-page">${pageHeader("Profit & Loss","Every calculation uses the saved historical cost for serial and quantity-tracked products.",datePresetControl(state.pnlPreset,"pnl-preset",true))}
        ${isTallyParallelMode(db.settings) ? `<div class="callout" style="margin-bottom:16px"><strong>Parallel P&amp;L is on.</strong> Normal sales use Product Master price; approved Staff / DOA sales use their saved override price and exact historical cost.</div>` : ""}
        ${state.pnlPreset==="custom"?`<div class="card card-pad" style="margin-bottom:16px"><div class="grid grid-2"><div class="field"><label>From</label><input class="input" type="date" id="pnl-from" value="${range.from}"></div><div class="field"><label>To</label><input class="input" type="date" id="pnl-to" value="${range.to}"></div></div></div>`:""}
        <div class="kpi-grid pnl-kpis">
          ${kpiCard("Net Sales",money(finance.netSales),"Excluding GST")}
          ${kpiCard("Cost of Goods Sold",money(finance.cogs),"Saved transaction cost")}
          ${kpiCard("Gross Profit",money(finance.grossProfit),finance.gpPercent.toFixed(1)+"% GP",finance.grossProfit<0?"negative":"positive")}
          ${kpiCard("Expenses",money(finance.expenses),"Selected period")}
          ${kpiCard("CN / DN Adjustment",(finance.cnDnAdjustment<0?"− ":"+ ")+money(Math.abs(finance.cnDnAdjustment)),"Included in net profit",finance.cnDnAdjustment<0?"negative":"positive")}
          ${kpiCard("Net Profit",money(finance.netProfit),finance.npPercent.toFixed(1)+"% NP",finance.netProfit<0?"negative":"positive")}
          ${kpiCard("Net Qty Sold",number(sum(finance.events,row=>row.qty)),"Sales minus returns")}
        </div>
        ${tabBar}${content}
      </div>`;
    };
    const renderPnLSummary=finance=>{
      const loss=finance.events.filter(row=>row.kind==="SALE"&&row.sales<row.cost);
      return `<div class="grid grid-2"><section class="card"><div class="card-head"><h3>Profit bridge</h3></div><div class="card-body">
        <div class="detail-grid" style="grid-template-columns:1fr"><div class="detail"><span>Net Sales</span><strong>${money(finance.netSales)}</strong></div><div class="detail"><span>Less: Cost of Goods Sold</span><strong class="negative">− ${money(finance.cogs)}</strong></div><div class="detail"><span>Gross Profit</span><strong class="${finance.grossProfit<0?"negative":"positive"}">${money(finance.grossProfit)}</strong></div><div class="detail"><span>Less: Expenses</span><strong class="negative">− ${money(finance.expenses)}</strong></div><div class="detail"><span>Add / Less: CN &amp; DN</span><strong class="${finance.cnDnAdjustment<0?"negative":"positive"}">${finance.cnDnAdjustment<0?"− ":"+ "}${money(Math.abs(finance.cnDnAdjustment))}</strong></div><div class="detail"><span>Net Profit</span><strong style="font-size:22px" class="${finance.netProfit<0?"negative":"positive"}">${money(finance.netProfit)}</strong></div></div>
      </div></section><section class="card"><div class="card-head"><h3>Loss-making sales</h3><span class="badge ${loss.length?"badge-danger":"badge-success"}">${loss.length}</span></div>
        ${loss.length?`<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Product / Identifier</th><th>Qty</th><th>Sale</th><th>Cost</th><th>Loss</th></tr></thead><tbody>${loss.map(row=>`<tr><td>${esc(row.invoiceNumber)}</td><td><div class="cell-main">${esc(row.modelName)}</div><div class="mono cell-sub">${esc(row.imei||"Quantity Only")}</div></td><td>${row.qty}</td><td class="money">${money(row.sales)}</td><td class="money">${money(row.cost)}</td><td class="money negative">${money(row.sales-row.cost)}</td></tr>`).join("")}</tbody></table></div>`:emptyState("No loss-making sales","All sales in this period are at or above cost.","check")}
      </section></div>`;
    };
    const renderPnLBreakdown=(finance,type)=>{
      const rows=type==="brand"?finance.brandWise:finance.modelWise;
      return `<section class="card"><div class="card-head"><h3>${type==="brand"?"Brand-wise":"Model-wise"} profitability</h3><span class="badge">${rows.length} ${type==="brand"?"brands":"models"}</span></div>
      ${rows.length?`<div class="table-wrap"><table><thead><tr><th>${type==="brand"?"Brand":"Model"}</th><th>Qty Sold</th><th>Sales</th><th>Cost</th><th>Gross Profit</th><th>Margin %</th></tr></thead><tbody>
      ${rows.map((row,index)=>`<tr class="${row.profit<0?"row-invalid":index===0?"":""}"><td class="cell-main">${esc(row.name)}${index===0&&row.profit>0?'<div class="cell-sub positive">Highest profit</div>':row.profit<0?'<div class="cell-sub negative">Loss-making</div>':""}</td><td>${row.qty}</td><td class="money">${money(row.sales)}</td><td class="money">${money(row.cost)}</td><td class="money ${row.profit<0?"negative":"positive"}">${money(row.profit)}</td><td>${row.margin.toFixed(2)}%</td></tr>`).join("")}</tbody></table></div>`:emptyState("No profitability data","Completed sales in the selected range will appear here.","pnl")}</section>`;
    };

    // Master database
    const renderMasters = async db => {
      const tabBar=tabs([{id:"brands",label:"Brands"},{id:"parties",label:"Parties"},{id:"products",label:"Products"},{id:"expense-heads",label:"Expense Heads"}],state.masterTab,"master-tab");
      let content="";
      if(state.masterTab==="brands")content=renderBrandMaster(db);
      else if(state.masterTab==="parties")content=renderPartyMaster(db);
      else if(state.masterTab==="products")content=renderModelMaster(db);
      else content=renderExpenseHeadMaster(db);

      const text=clean(value);

      if(/^\d{4}-\d{2}-\d{2}$/.test(text))return text;

      if(match)return match[3]+"-"+match[2].padStart(2,"0")+"-"+match[1].padStart(2,"0");
      const parsed=new Date(text);
      return Number.isNaN(parsed.getTime())?"":localDateISO(parsed);

    const preparePurchaseCSV=async file=>{
      const parsed=parseCSV(await readFileText(file));
      if(!parsed.headers.length)throw new Error("CSV file is empty");
      const availableHeaders=new Set(parsed.headers.map(normalizedHeader));
      if(!availableHeaders.has(normalizedHeader("Product"))||!["Serial / IMEI","IMEI"].some(header=>availableHeaders.has(normalizedHeader(header))))throw new Error("CSV must contain only the required Product and Serial / IMEI columns");
      const setup=state.purchaseImportSetup,db=await dataService.getDatabase(),supplier=db.parties.find(row=>row.id===setup.supplierId&&row.status==="ACTIVE"&&["SUPPLIER","BOTH"].includes(row.type));

      const rows=parsed.rows.map(raw=>{
        const imei=normalizeIMEI(pickHeader(raw,["Serial / IMEI","Serial","Serial Number","IMEI","IMEI Number"]));
        const modelText=pickHeader(raw,["Product","Product Name","Model","Model Name"]);
        const modelCandidates=db.models.filter(row=>row.status==="ACTIVE"&&[productMasterName(row),row.name].some(value=>lower(value)===lower(modelText)));
        const model=modelCandidates.length===1?modelCandidates[0]:null;
        const brand=db.brands.find(row=>row.id===model?.brandId&&row.status==="ACTIVE"),brandText=brand?.name||"";
        const reasons=[];
        if(!isValidIMEI(imei))reasons.push("Invalid IMEI");
        else if(seen.has(imei))reasons.push("Duplicate IMEI");
        else if(existing.has(imei))reasons.push("Existing IMEI");
        if(!modelText)reasons.push("Missing Product");
        else if(modelCandidates.length>1)reasons.push("Product name is not unique");
        else if(!model||!brand)reasons.push("Missing Product");
        if(model&&isQuantityTracked(model))reasons.push("Quantity product · use New Purchase");
        const purchaseRate=Number(model?.purchaseRate),gst=Number(model?.gst);
        if(model&&(!Number.isFinite(purchaseRate)||purchaseRate<=0))reasons.push("Product Master Price Missing");
        if(model&&(!Number.isFinite(gst)||gst<0))reasons.push("Product Master GST Invalid");
        if(imei)seen.add(imei);
        return {
          rowNo:raw.__row,imei,supplierText:supplier.name,invoiceNumber:setup.invoiceNumber,invoiceDate:setup.invoiceDate,brandText,modelText,variant:"",
          productText:[brandText,modelText].filter(Boolean).join(" · "),
          purchaseRate,gst,
          supplierId:supplier?.id,modelId:model?.id,reasons,valid:reasons.length===0
        };
      });
      const stats={total:rows.length,valid:rows.filter(row=>row.valid).length,duplicate:rows.filter(row=>row.reasons.includes("Duplicate IMEI")).length,existing:rows.filter(row=>row.reasons.includes("Existing IMEI")).length,invalid:rows.filter(row=>row.reasons.includes("Invalid IMEI")).length,missingModel:rows.filter(row=>row.reasons.some(reason=>reason.includes("Brand")||reason.includes("Product"))).length,missingRate:rows.filter(row=>row.reasons.some(reason=>reason.includes("Master Price"))).length};
      return {fileName:file.name,rows,stats};

    const prepareActivationCSV=async file=>{
      const parsed=parseCSV(await readFileText(file));
      if(!parsed.headers.length)throw new Error("CSV file is empty");
      const imeiHeaders=["Serial / IMEI","Serial","Serial Number","IMEI","IMEI Number","Device IMEI"];
      const dateHeaders=["Activation Date","Activated On","Date of Activation","DOA"];
      const availableHeaders=new Set(parsed.headers.map(normalizedHeader));
      if(!imeiHeaders.some(header=>availableHeaders.has(normalizedHeader(header)))||!dateHeaders.some(header=>availableHeaders.has(normalizedHeader(header)))){
        throw new Error("CSV must contain Serial / IMEI and Activation Date columns");
      }
      const db=await dataService.getDatabase(),inventory=new Map(db.inventory.map(row=>[row.imei,row]));
      const rows=parsed.rows.map(raw=>({
        rowNo:raw.__row,
        imei:normalizeIMEI(pickHeader(raw,imeiHeaders)),
        activationDate:normalizeDateValue(pickHeader(raw,dateHeaders))
      }));
      const lastValidIndex=new Map();
      rows.forEach((row,index)=>{
        if(isValidIMEI(row.imei)&&isValidDateISO(row.activationDate))lastValidIndex.set(row.imei,index);
      });
      rows.forEach((row,index)=>{
        if(!isValidIMEI(row.imei))row.classification="INVALID_IMEI";
        else if(!isValidDateISO(row.activationDate))row.classification="INVALID_DATE";
        else if(lastValidIndex.get(row.imei)!==index)row.classification="SUPERSEDED";
        else if(!inventory.has(row.imei))row.classification="UNMATCHED";
        else if(inventory.get(row.imei).activation?.status==="ACTIVATED")row.classification="UPDATE";
        else row.classification="NEW";
      });
      const validRows=rows.filter(row=>isValidIMEI(row.imei)&&isValidDateISO(row.activationDate));
      const stats={
        totalRows:rows.length,uniqueIMEIs:lastValidIndex.size,
        newActivations:rows.filter(row=>row.classification==="NEW").length,
        updates:rows.filter(row=>row.classification==="UPDATE").length,
        unmatched:rows.filter(row=>row.classification==="UNMATCHED").length,
        duplicatesMerged:validRows.length-lastValidIndex.size,
        invalid:rows.filter(row=>["INVALID_IMEI","INVALID_DATE"].includes(row.classification)).length
      };
      return {fileName:file.name,rows,stats};
    };
